<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Line Vm - V1.4 (Real 8-Bit Edition)</title>
	<style>
		:root {
			/* Classic Black & Grey aesthetic for standard Line OS games */
			--case-color: #1a1a1c;
			--screen-bg: #b4b4b4; 
			--screen-pixel: #111111;
		}

		body {
			background-color: #050505;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			height: 100vh;
			margin: 0;
			font-family: 'Courier New', Courier, monospace;
			color: #eee;
			overflow: hidden;
			user-select: none;
			touch-action: none;
		}

		/* --- HARDWARE --- */
		#line-player-case {
			background-color: var(--case-color);
			padding: 25px;
			border-radius: 10px;
			box-shadow: inset 0 1px 2px rgba(255,255,255,0.1), 0 15px 35px rgba(0,0,0,0.8);
			display: flex;
			flex-direction: column;
			align-items: center;
			border: 2px solid #111;
			position: relative;
			transition: all 0.3s ease;
		}

		.brand-logo {
			color: #aaa;
			font-weight: bold;
			letter-spacing: 2px;
			font-size: 14px;
			margin-bottom: 2px;
			text-transform: uppercase;
			font-family: sans-serif;
			text-shadow: 0 1px 0 rgba(255,255,255,0.1);
		}

		.hardware-spec {
			color: #666;
			font-size: 9px;
			margin-bottom: 10px;
			letter-spacing: 1px;
			font-family: 'Courier New', monospace;
		}

		#screen-bezel {
			background-color: #222;
			padding: 15px 20px;
			border-radius: 5px 5px 20px 5px;
			box-shadow: inset 0 0 15px rgba(0,0,0,0.8);
			margin-bottom: 15px;
			transition: all 0.3s ease;
			position: relative;
		}

		/* The Screen */
		#screen-viewport {
			width: 480px;
			height: 320px;
			background-color: #000;
			border: 3px solid #111;
			position: relative;
			overflow: hidden;
			box-shadow: inset 2px 2px 5px rgba(0,0,0,0.4);
			transition: width 0.3s, height 0.3s;
			transform: translateZ(0); will-change: transform; /* Force GPU Hardware Acceleration */
		}

		canvas {
			width: 100%;
			height: 100%;
			transform: translateZ(0); will-change: transform;
			display: block;
			image-rendering: -moz-crisp-edges;
			image-rendering: -webkit-optimize-contrast;
			image-rendering: crisp-edges;
			image-rendering: pixelated;
			position: absolute;
			top: 0; left: 0;
			z-index: 10;
		}

		.scanlines {
			position: absolute;
			top: 0; left: 0; width: 100%; height: 100%;
			background: repeating-linear-gradient(to bottom, transparent 0, transparent 2px, rgba(0,0,0,0.15) 2px, rgba(0,0,0,0.15) 4px); /* Optimized for 0 lag */
			pointer-events: none;
			z-index: 100;
			opacity: 1;
			transition: opacity 0.3s;
		}
		.scanlines.hidden { opacity: 0; }

		/* --- CONTROLS --- */
		.controls-area { width: 100%; padding: 0 10px; box-sizing: border-box; }
		.controls-hint { font-size: 10px; text-align: center; opacity: 0.5; margin-top: 5px; }
		.key {
			display: inline-block;
			background: #333;
			border-bottom: 2px solid #111;
			border-radius: 4px;
			padding: 4px 8px;
			margin: 2px;
			font-weight: bold;
			color: white;
			font-size: 10px;
		}

		/* --- UI OVERLAYS --- */
		#ui-layer {
			position: absolute;
			top: 0; left: 0; width: 100%; height: 100%;
			display: flex;
			flex-direction: column;
			padding: 10px;
			box-sizing: border-box;
			font-family: 'Courier New', monospace;
			font-weight: bold;
			color: var(--screen-pixel);
			z-index: 60;
			background-color: var(--screen-bg);
		}

		#menu-list li { padding: 5px; cursor: pointer; border: 1px solid transparent; }
		#menu-list li:hover { background-color: rgba(0,0,0,0.05); }

		/* Modal for Input */
		#modal-overlay {
			position: absolute;
			top: 0; left: 0; width: 100%; height: 100%;
			background: rgba(0,0,0,0.9);
			z-index: 200;
			display: none;
			align-items: center;
			justify-content: center;
			flex-direction: column;
		}
		textarea {
			width: 90%; height: 50%;
			background: #222; color: #bbb;
			border: 1px solid #444;
			font-family: monospace;
			font-size: 10px;
			padding: 5px;
			resize: none;
		}
		.modal-buttons { display:flex; gap:10px; margin-top:10px; }
		.modal-btn {
			padding: 8px 15px;
			background: #444; color: white; border: none; cursor: pointer;
			font-family: 'Courier New', monospace; font-weight: bold; font-size: 10px;
		}
		.modal-btn:hover { background: #555; }
		
		/* --- FULLSCREEN MODE --- */
		body.fullscreen-active { background-color: #000; }
		body.fullscreen-active #line-player-case {
			width: 100vw; height: 100vh; padding: 0; border: none; border-radius: 0; box-shadow: none; background: #000;
		}
		body.fullscreen-active .brand-logo, 
		body.fullscreen-active .hardware-spec, 
		body.fullscreen-active .controls-area { display: none; }
		
		body.fullscreen-active #screen-bezel {
			width: 100%; height: 100%; padding: 0; margin: 0; border-radius: 0; box-shadow: none; background: #000; display: flex; align-items: center; justify-content: center;
		}
		
		body.fullscreen-active #screen-viewport {
			width: 100vw !important;
			height: 100vh !important;
			max-width: calc(100vh * 1.33333) !important;
			max-height: calc(100vw * 0.75) !important;
			border: none;
			box-shadow: none;
		}
		
		body.fullscreen-active #ui-layer {
			font-size: max(2vh, 12px) !important;
		}

		/* --- SCREEN ONLY MODE --- */
		body.screen-only-active #line-player-case {
			background: transparent; padding: 0; border: none; box-shadow: none;
		}
		body.screen-only-active .brand-logo,
		body.screen-only-active .hardware-spec,
		body.screen-only-active .controls-area { display: none; }
		body.screen-only-active #screen-bezel {
			background: transparent; padding: 0; box-shadow: none; margin: 0; border-radius: 0;
		}
		body.screen-only-active #screen-viewport {
			border: none;
			box-shadow: none;
		}
	</style>
</head>
<body>

	<div id="line-player-case">
		<div class="brand-logo">Line Vm</div>
		<div class="hardware-spec" id="hardware-display">LINE 8 CHIP (8-BIT) | 64KB RAM | LGC GPU | VIRTUAL KERNEL</div>
		
		<div id="screen-bezel">
			<div id="screen-viewport">
				<canvas id="gameCanvas" width="128" height="96"></canvas>
				<div class="scanlines" id="scanlines"></div>
				
				<div id="ui-layer">
					<div id="z80-registers" style="font-size: 8px; color: rgba(17, 17, 17, 0.8); border-bottom: 1px dashed currentColor; padding-bottom: 2px; margin-bottom: 4px; display: flex; justify-content: space-between;">
						<span id="reg-af">AF:0000</span>
						<span id="reg-bc">BC:0000</span>
						<span id="reg-de">DE:0000</span>
						<span id="reg-hl">HL:0000</span>
						<span id="reg-pc">PC:0100</span>
					</div>

					<div style="border-bottom: 2px solid currentColor; margin-bottom: 5px; display:flex; justify-content:space-between;">
						<span>Line Vm V1.4</span>
						<span id="clock">12:00</span>
					</div>
					<ul id="menu-list" style="list-style:none; padding:0; flex-grow:1; overflow-y:auto; margin:0;">
					</ul>
					<div style="font-size:0.8em; opacity:0.8; border-top:1px solid currentColor; padding-top:2px;">
						NAV: D-PAD | SEL: Z | OPT: C | BACK: ESC
					</div>
				</div>
			</div>
		</div>

		<div class="controls-area">
			<div class="controls-hint">
				<span class="key"><span class="t-btn" data-key="up">↑</span><span class="t-btn" data-key="down">↓</span><span class="t-btn" data-key="left">←</span><span class="t-btn" data-key="right">→</span></span> D-PAD &nbsp;
				<span class="key"><span class="t-btn" data-key="w">W</span><span class="t-btn" data-key="a_key">A</span><span class="t-btn" data-key="s">S</span><span class="t-btn" data-key="d">D</span></span> MOVE &nbsp;
				<span class="key t-btn" data-key="space">SPACE</span> JUMP &nbsp;
				<span class="key t-btn" data-key="a">Z</span> A &nbsp;
				<span class="key t-btn" data-key="b">X</span> B &nbsp;
				<span class="key t-btn" data-key="y">Y</span> Y &nbsp;
				<span class="key t-btn" data-key="c">C</span> OPT &nbsp;
				<span class="key t-btn" data-key="back">ESC</span> BACK
			</div>
			<div style="text-align:center; font-size:9px; color:#666; margin-top:5px;">
			Use 'PRG: CTRL REMAPPER' to set custom buttons
		</div>
	</div>
	
	<input type="file" id="file-loader" style="display:none;" accept=".txt,.lmf,.lmt,.ch8,.ch81,.bas,.lmv,.lmp">
	<input type="file" id="ls-loader" style="display:none;" accept=".ls">
	<input type="file" id="media-loader" style="display:none;" accept="video/mp4,video/webm,image/png,image/jpeg,image/gif">
		<video id="hidden-video" style="display:none;" muted playsinline></video>
		<img id="hidden-image" style="display:none;">
		<canvas id="hidden-canvas" width="128" height="96" style="display:none;"></canvas>
	</div>

	<div id="modal-overlay">
		<div id="modal-title" style="color:white; font-family:sans-serif; margin-bottom:10px; font-weight:bold;"></div>
		<textarea id="modal-input" placeholder="..."></textarea>
		<div class="modal-buttons">
			<button class="modal-btn" id="modal-action-btn-1">ACTION 1</button>
			<button class="modal-btn" id="modal-action-btn-2" style="display:none;">ACTION 2</button>
			<button class="modal-btn" onclick="closeModal()">CLOSE</button>
		</div>
		<div id="modal-status" style="color:#0f0; font-family:monospace; margin-top:10px; line-height:1.2; text-align:center;"></div>
	</div>

<script>
const canvas = document.getElementById('gameCanvas');
const uiLayer = document.getElementById('ui-layer');
const menuList = document.getElementById('menu-list');
const videoElement = document.getElementById('hidden-video');
const imageElement = document.getElementById('hidden-image');
const offscreenCanvas = document.getElementById('hidden-canvas');
const offCtx = offscreenCanvas.getContext('2d', { willReadFrequently: true });

// --- DEFAULT OS KEYMAPPINGS (DYNAMIC CONTROLS) ---
let KEY_MAPPINGS = JSON.parse(localStorage.getItem('LINE_OS_KEYMAP')) || {
	up: ['ArrowUp'], down: ['ArrowDown'], left: ['ArrowLeft'], right: ['ArrowRight'],
	w: ['w','W'], s: ['s','S'], a_key: ['a','A'], d: ['d','D'],
	space: [' '], a: ['z','Z','Enter'], b: ['x','X'], y: ['y','Y'], c: ['c','C','Shift'], back: ['Escape']
};

// --- LINEPAD 8/16-BIT AUDIO SYSTEM ---
const LINEPAD = {
	ctx: null,
	init: function() {
		if (!this.ctx) {
			const AudioContext = window.AudioContext || window.webkitAudioContext;
			this.ctx = new AudioContext();
		}
	},
	unlock: function() {
		if (this.ctx && this.ctx.state === 'suspended') {
			this.ctx.resume();
		} else if (!this.ctx) {
			this.init();
		}
	},
	play: function(type, freq, duration, vol=0.5, endFreq=null, opts={}) {
		this.unlock();
		if (!this.ctx || this.ctx.state === 'suspended') return;
		if (endFreq === null) endFreq = freq;

		const t = this.ctx.currentTime;
		const durS = duration / 1000;
		const gain = this.ctx.createGain();

		// Check if this is a strict legacy call (no ADSR overrides, using original types 0-3)
		const isLegacy = (type >= 0 && type <= 3) && !opts.attack && !opts.release && !opts.decay;

		// --- NEW UPGRADED AUDIO ENGINE ---
		if (!isLegacy) {
			gain.connect(this.ctx.destination);
			const a = opts.attack || 0.005;
			const s = opts.sustain !== undefined ? opts.sustain : 0;
			const r = opts.release || (durS / 4);

			gain.gain.setValueAtTime(0, t);
			gain.gain.linearRampToValueAtTime(vol, t + a);
			if (opts.decay) {
				gain.gain.setTargetAtTime(Math.max(0.001, s * vol), t + a, opts.decay);
			}
			gain.gain.setTargetAtTime(0.001, t + durS - r, r / 3);

			if (type === 3 || type === 6 || type === 9) { // Type 3 is passed here only if ADSR was overridden
				const bufferSize = this.ctx.sampleRate * durS;
				const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
				const data = buffer.getChannelData(0);
				let lastVal = 0;
				let lfsr = 1;
				let isMetallic = (type === 6);
				for (let i = 0; i < bufferSize; i++) {
					if (i % Math.max(1, Math.floor(freq / 50)) === 0) {
						let bit = (lfsr & 1) ^ ((lfsr >> (isMetallic ? 6 : 1)) & 1);
						lfsr = (lfsr >> 1) | (bit << 14);
						lastVal = (lfsr & 1) ? 1 : -1;
					}
					data[i] = lastVal;
				}
				const noiseSrc = this.ctx.createBufferSource();
				noiseSrc.buffer = buffer;
				noiseSrc.connect(gain);
				noiseSrc.start(t);
				noiseSrc.stop(t + durS);
				return;
			}

			const osc = this.ctx.createOscillator();
			let mainNode = osc;

			if (type === 4 || type === 5 || type === 8) {
				osc.type = 'sawtooth';
				const ws = this.ctx.createWaveShaper();
				const curve = new Float32Array(256);
				let duty = 0.5; // Type 8 is authentic 50%
				if (type === 4) duty = 0.25;
				if (type === 5) duty = 0.125;
				for (let i = 0; i < 256; i++) curve[i] = (i / 256 < duty) ? 1 : -1;
				ws.curve = curve;
				osc.connect(ws);
				mainNode = ws;
			} else if (type === 7) {
				osc.type = 'sine';
				const fmOsc = this.ctx.createOscillator();
				const fmGain = this.ctx.createGain();
				fmOsc.type = 'sine';
				fmOsc.frequency.setValueAtTime(freq * (opts.fmRatio || 2.0), t);
				fmGain.gain.setValueAtTime(freq * (opts.fmAmount || 1.5), t);
				fmOsc.connect(fmGain);
				fmGain.connect(osc.frequency);
				fmOsc.start(t);
				fmOsc.stop(t + durS);
			} else {
				const types = ['square', 'sawtooth', 'triangle', 'sine'];
			osc.type = types[type % 4] || 'square';
			if (type > 9) { try{ osc.detune.setValueAtTime((type%10)*15, t); }catch(e){} } // Universal Audio Expansion Processor
			}

			mainNode.connect(gain);
			osc.frequency.setValueAtTime(freq, t);
			if (freq !== endFreq) osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), t + durS);
			osc.start(t);
			osc.stop(t + durS);
			return;
		}

		// --- STRICT BACKWARD COMPATIBILITY ENGINE ---
		const osc = this.ctx.createOscillator();
		osc.connect(gain);
		gain.connect(this.ctx.destination);

		if (type === 3) {
			const bufferSize = this.ctx.sampleRate * durS;
			const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
			const data = buffer.getChannelData(0);
			let lastVal = 0;
			for (let i = 0; i < bufferSize; i++) {
				if (i % Math.max(1, Math.floor(freq / 50)) === 0) lastVal = Math.random() * 2 - 1;
				data[i] = lastVal;
			}
			const noiseSrc = this.ctx.createBufferSource();
			noiseSrc.buffer = buffer;
			noiseSrc.connect(gain);
			noiseSrc.start(t);
			
			gain.gain.setValueAtTime(vol, t);
			gain.gain.exponentialRampToValueAtTime(0.01, t + durS);
			noiseSrc.stop(t + durS);
			return;
		}

		const types = ['square', 'sawtooth', 'triangle', 'sine'];
			osc.type = types[type % 4] || 'square';
			if (type > 9) { try{ osc.detune.setValueAtTime((type%10)*15, t); }catch(e){} } // Universal Audio Expansion Processor
		
		osc.frequency.setValueAtTime(freq, t);
		if (freq !== endFreq) {
			osc.frequency.exponentialRampToValueAtTime(Math.max(1, endFreq), t + durS);
		}
		
		gain.gain.setValueAtTime(vol, t);
		gain.gain.setTargetAtTime(0.001, t + durS, durS / 4);

		osc.start(t);
		osc.stop(t + durS);
	}
};

// --- LINE128 Z80 HARDWARE CHIP ---
const _line128_regBuf = new ArrayBuffer(12);
const _line128_reg8 = new Uint8Array(_line128_regBuf);
const _line128_reg16 = new Uint16Array(_line128_regBuf);

const LINE128_MEMORY = {
	clock:{t:0}, ime:0, halt:0, _eiDelay: false,
	memory: new Uint8Array(65536), 
	_ie:0, _if:0, _doubleSpeed:false, _key1:0,

	r: {
		get f() { return _line128_reg8[0]; }, set f(v) { _line128_reg8[0] = v & 0xF0; },
		get a() { return _line128_reg8[1]; }, set a(v) { _line128_reg8[1] = v; },
		get af() { return _line128_reg16[0]; }, set af(v) { _line128_reg16[0] = v & 0xFFF0; },
		get c() { return _line128_reg8[2]; }, set c(v) { _line128_reg8[2] = v; },
		get b() { return _line128_reg8[3]; }, set b(v) { _line128_reg8[3] = v; },
		get bc() { return _line128_reg16[1]; }, set bc(v) { _line128_reg16[1] = v; },
		get e() { return _line128_reg8[4]; }, set e(v) { _line128_reg8[4] = v; },
		get d() { return _line128_reg8[5]; }, set d(v) { _line128_reg8[5] = v; },
		get de() { return _line128_reg16[2]; }, set de(v) { _line128_reg16[2] = v; },
		get l() { return _line128_reg8[6]; }, set l(v) { _line128_reg8[6] = v; },
		get h() { return _line128_reg8[7]; }, set h(v) { _line128_reg8[7] = v; },
		get hl() { return _line128_reg16[3]; }, set hl(v) { _line128_reg16[3] = v; },
		get sp() { return _line128_reg16[4]; }, set sp(v) { _line128_reg16[4] = v; },
		get pc() { return _line128_reg16[5]; }, set pc(v) { _line128_reg16[5] = v; }
	},

	rb: function(a) { return this.memory[a]; },
	wb: function(a,v) { this.memory[a] = v; },
	rw: function(a) { return this.rb(a)|(this.rb(a+1)<<8); },
	ww: function(a,v) { this.wb(a, v&0xFF); this.wb(a+1, v>>8); },

	init: function() { 
		this.r.af = 0x01B0; this.r.bc = 0x0013; this.r.de = 0x00D8; this.r.hl = 0x014D; 
		this.r.sp = 0xFFFE; this.r.pc = 0x0100;
		this.ime=0; this.halt=0; this._eiDelay=false;
		this.memory.fill(0);
		
		this.memory[0x0100] = 0x3C; this.memory[0x0101] = 0x03; this.memory[0x0102] = 0x13; 
		this.memory[0x0103] = 0x23; this.memory[0x0104] = 0x18; this.memory[0x0105] = 0xFA; 
	},

	step: function() {
		if (this._eiDelay) { this.ime = 1; this._eiDelay = false; }
		if(this.halt) { this.clock.t=4; if(this._ie&this._if)this.halt=0; else this.halt=0; return; }
		
		let op=this.rb(this.r.pc++); this.clock.t=4; let r=this.r; let t=0;
		
		const add=n=>{let a=r.a;let res=a+n;r.f=(res&255?0:128)|((a^n^res)&16?32:0)|(res>255?16:0);r.a=res&255;}
		const adc=n=>{let a=r.a;let c=(r.f&16)?1:0;let res=a+n+c;r.f=(res&255?0:128)|((a^n^res)&16?32:0)|(res>255?16:0);r.a=res&255;}
		const sub=n=>{let a=r.a;let res=a-n;r.f=(res===0?128:0)|64|(((a&0xF)<(n&0xF))?32:0)|(res<0?16:0);r.a=res&0xFF;}
		const sbc=n=>{let a=r.a;let c=(r.f&16)?1:0;let res=a-n-c;r.f=(res&0xFF?0:128)|64|(((a&0xF)-(n&0xF)-c)<0?32:0)|(res<0?16:0);r.a=res&0xFF;}
		const and=n=>{r.a&=n;r.f=(r.a?0:128)|32;}
		const or=n=>{r.a|=n;r.f=(r.a?0:128);}
		const xor=n=>{r.a^=n;r.f=(r.a?0:128);}
		const cp=n=>{let res=r.a-n;r.f=(res===0?128:0)|64|(((r.a&0xF)<(n&0xF))?32:0)|(res<0?16:0);}
		const inc=n=>{let res=(n+1)&255;r.f=(r.f&16)|(res?0:128)|((res&15)?0:32);return res;}
		const dec=n=>{let res=(n-1)&255;r.f=(r.f&16)|64|(res?0:128)|((res&15)==15?32:0);return res;}
		const add16=(v)=>{let hl=r.hl;let res=hl+v;r.f=(r.f&128)|((hl^v^(res&65535))&4096?32:0)|(res>65535?16:0);r.hl=res&0xFFFF;this.clock.t+=4;}

		switch(op){

function launch8Chipi() { SYSTEM.notification = "8CHIPI KERNEL ACTIVE"; SYSTEM.notifTimer = 180; }
function launchCH81() { SYSTEM.notification = "CH81 KERNEL ACTIVE"; SYSTEM.notifTimer = 180; }
function updateCH81() { 
	if(TRUE_KERNEL_CH81.state === 'WAIT_FRAME') TRUE_KERNEL_CH81.state = 'RUNNING';
	let cycles = 0;
	let maxCycles = TRUE_KERNEL_CH81.ch8Mode ? 15 : 1000;
	while(TRUE_KERNEL_CH81.state === 'RUNNING' && cycles < maxCycles) { TRUE_KERNEL_CH81.cycle(); cycles++; }
	if (TRUE_KERNEL_CH81.ch8Mode) {
		if (TRUE_KERNEL_CH81.dt > 0) TRUE_KERNEL_CH81.dt--;
		if (TRUE_KERNEL_CH81.st > 0) { TRUE_KERNEL_CH81.st--; LINEPAD.play(0, 440, 50, 0.2); }
	}
}
function renderCH81() {
	if (TRUE_KERNEL_CH81.ch8Mode) {
		LGC.setColor("#000");
		LGC.clear();
		LGC.ctx.fillStyle = SYSTEM.colorMode ? "#FFF" : "#0f0";
		let startY = 16;
		for (let y = 0; y < 32; y++) {
			for (let x = 0; x < 64; x++) {
				if (TRUE_KERNEL_CH81.vram[x + (y * 64)]) {

	}
}

}

const LINE_STORAGE = {
	sig: "CH81_LS_VM_SIG_V2",
	volatile: {}, 
	init: function() {
		if (SYSTEM.localStorageEnabled) {
			let data = localStorage.getItem('ZLINE_OS_STORAGE');
			if (data && !data.startsWith(this.sig)) { 
				console.warn("KERNEL: Unauthorized un-signed local storage."); 
				localStorage.removeItem('ZLINE_OS_STORAGE'); 
			} else if (data) {
				try { this.volatile = JSON.parse(data.substring(this.sig.length + 1)); } catch(e) {}
			}
		}
	},
	saveAll: function() {
		if (!SYSTEM.localStorageEnabled) return;
		let finalSave = this.sig + ":" + JSON.stringify(this.volatile);
		localStorage.setItem('ZLINE_OS_STORAGE', finalSave);
	},
	save: function(key, value) { this.volatile[key] = value; this.saveAll(); },
	load: function(key) { return this.volatile[key]; },
	loadAll: function() { return this.volatile; },
	remove: function(key) { delete this.volatile[key]; this.saveAll(); },
	delete: function() { 
		this.volatile = {};
		if (SYSTEM.localStorageEnabled) localStorage.removeItem('ZLINE_OS_STORAGE'); 
	},
	exportStr: function() { return !SYSTEM.localStorageEnabled ? "" : (localStorage.getItem('ZLINE_OS_STORAGE') || ""); },
	importStr: function(str) { 
		if (!SYSTEM.localStorageEnabled) return false;
		if(str && str.startsWith(this.sig)) { localStorage.setItem('ZLINE_OS_STORAGE', str); this.init(); return true; } 
		return false; 
	}
};

window.progression_save_data = function(lockId, dataObj) {
	let dataStr = typeof dataObj === 'string' ? dataObj : JSON.stringify(dataObj);
	let h = 0;
	for(let i=0; i<dataStr.length; i++) { h = ((h << 5) - h) + dataStr.charCodeAt(i); h |= 0; }
	let hash8 = Math.abs(h).toString().padStart(8, '1').substring(0, 8);
	let payloadStr = JSON.stringify({ data: dataObj, hash: hash8 });
	LINE_STORAGE.save("PROG_" + lockId, "LMT::" + encodeLMT(payloadStr));
};

window.progression_lock = function(lockId) {
	let raw = LINE_STORAGE.load("PROG_" + lockId);
	if (!raw) return { locked: true, data: null };
	let payload;
	if (typeof raw === 'string' && raw.startsWith("LMT::")) {
		try { payload = JSON.parse(decodeLMT(raw.substring(5))); } catch(e) { return { locked: true, error: true }; }
	} else {
		payload = raw; 
	}
	
	if(payload && payload.hash) {
		let dataStr = typeof payload.data === 'string' ? payload.data : JSON.stringify(payload.data);
		let h = 0; for(let i=0; i<dataStr.length; i++) { h = ((h << 5) - h) + dataStr.charCodeAt(i); h |= 0; }
		let expectedHash = Math.abs(h).toString().padStart(8, '1').substring(0, 8);
		
		let currentPayload = window.__current_payload || "";
		let strictMatches = currentPayload.match(/progression_lock/g);
		let strictAntiCheat = strictMatches && strictMatches.length >= 2;
		
		if (payload.hash !== expectedHash) {
			if(strictAntiCheat) {
				SYSTEM.panic("PROGRESSION LOCK: TAMPERED SAVE");
			}
			return { locked: true, error: true };
		}
		return { locked: false, data: payload.data };
	}
	return { locked: false, data: payload }; 
};

window.applyLineLanguage = function(content) {
	if (content.includes('[ENGINE SOURCE CODE]')) {
		return content.replace(/\[ENGINE SOURCE CODE\]([\s\S]*?)\[\/ENGINE SOURCE CODE\]/gi, (match, innerCode) => {
			let converted = innerCode
				.replace(/\bconst\b/g, 'section')
				.replace(/\bFunction\b/g, 'collect')
				.replace(/\bfunction\b/g, 'collect')
				.replace(/\blet\b/g, 'allow');
			return '[ENGINE SOURCE CODE]' + converted + '[/ENGINE SOURCE CODE]';
		});
	} return content;
};

function updateSavManager() {
	let data = LINE_STORAGE.loadAll() || {};
	let keys = Object.keys(data);
	if (SAV_MAN.viewMode) {
		if (inputs.back && !prevInputs.back) { SAV_MAN.viewMode = false; return; }
		if ((inputs.up || inputs.w) && !(prevInputs.up || prevInputs.w)) SAV_MAN.scrollY = Math.max(0, SAV_MAN.scrollY - 1);
		if ((inputs.down || inputs.s) && !(prevInputs.down || prevInputs.s)) SAV_MAN.scrollY = Math.min(Math.max(0, SAV_MAN.viewText.length - 6), SAV_MAN.scrollY + 1);
		return;
	}

	let maxItems = keys.length > 0 ? keys.length + 1 : 1; 
	if ((inputs.up || inputs.w) && !(prevInputs.up || prevInputs.w)) SAV_MAN.cursor = Math.max(0, SAV_MAN.cursor - 1); 
	if ((inputs.down || inputs.s) && !(prevInputs.down || prevInputs.s)) SAV_MAN.cursor = Math.min(maxItems - 1, SAV_MAN.cursor + 1);
	
	let actionPressed = (inputs.a && !prevInputs.a) || (inputs.b && !prevInputs.b) || (inputs.y && !prevInputs.y) || (inputs.space && !prevInputs.space);
	let optPressed = (inputs.c && !prevInputs.c);

	if (actionPressed && keys.length > 0) {
		if (SAV_MAN.cursor < keys.length) {
			SAV_MAN.viewMode = true;
			SAV_MAN.viewKey = keys[SAV_MAN.cursor];
			SAV_MAN.scrollY = 0;
			let rawData = data[SAV_MAN.viewKey];
			let displayStr = "NULL";
			if (typeof rawData === 'string' && rawData.startsWith("LMT::")) {
				try { 
					let decoded = decodeLMT(rawData.substring(5)); 
					displayStr = JSON.stringify(JSON.parse(decoded), null, 2);
				} catch(e) { displayStr = rawData; }
			} else {
				displayStr = JSON.stringify(rawData, null, 2) || "NULL";
			}
			
			SAV_MAN.viewText = [];
			let lines = displayStr.split('\n');
			for (let l of lines) {
				let currentLine = '';
				for (let char of l) {
					if (LGC.measureText(currentLine + char).width > LGC.width - 4) {
						SAV_MAN.viewText.push(currentLine); currentLine = char;
					} else { currentLine += char; }
				}
				if (currentLine) SAV_MAN.viewText.push(currentLine);
			}
		} else if (SAV_MAN.cursor === keys.length) {
            if (SAV_MAN.confirmDeleteAll === 1) {
                LINE_STORAGE.delete(); SAV_MAN.cursor = 0; SAV_MAN.confirmDeleteAll = 0;
                SYSTEM.notification = "SAVES DELETED"; SYSTEM.notifTimer = 180;
            } else {
                SAV_MAN.confirmDeleteAll = 1;
                SYSTEM.notification = "PRESS AGAIN TO FORMAT ALL"; SYSTEM.notifTimer = 180;
            }
        }
	} else if (optPressed && keys.length > 0 && SAV_MAN.cursor < keys.length) {
		let keyToDel = keys[SAV_MAN.cursor];
		delete data[keyToDel];
		let encoded = encodeLMT(JSON.stringify(data));
		localStorage.setItem('ZLINE_OS_STORAGE', LINE_STORAGE.sig + ":" + encoded);
		if (SAV_MAN.cursor >= Object.keys(data).length) SAV_MAN.cursor = Math.max(0, Object.keys(data).length - 1);
	}
}

function generateCenteredLMP(asciiArr, scale, bgHex) {
	let pixels = new Array(128*96).fill(bgHex);
	let sw = asciiArr[0].length; let sh = asciiArr.length;
	let startX = Math.floor((128 - (sw * scale)) / 2);
	let startY = Math.floor((96 - (sh * scale)) / 2);
	for (let y = 0; y < sh; y++) {
		for (let x = 0; x < sw; x++) {
			let c = asciiArr[y][x];
			if (c !== '.') {
				for(let sy=0; sy<scale; sy++) {
					for(let sx=0; sx<scale; sx++) {
						let px = startX + x*scale + sx; let py = startY + y*scale + sy;
						if (px>=0 && px<128 && py>=0 && py<96) pixels[py * 128 + px] = c;
					}
				}
			}
		}
	}
	let out = ""; let lastColor = pixels[0]; let count = 0;
	for(let i=0; i<pixels.length; i++) {
		if (pixels[i] === lastColor && count < 255) count++;
		else { out += lastColor + count.toString(16).toUpperCase() + ","; lastColor = pixels[i]; count = 1; }
	}
	if (count > 0) out += lastColor + count.toString(16).toUpperCase() + ",";
	return out;
}

\t[ {t:4,f1:110,f2:110,d:150}, null, {t:4,f1:110,f2:110,d:150}, {t:4,f1:146,f2:146,d:150}, {t:4,f1:165,f2:165,d:150}, null, {t:4,f1:146,f2:146,d:100}, null ]\n];\nallow bSpeeds = [10, 8, 12];\n\nallow cursor = 0;\nallow scrollCol = 0;\nallow pBeat = -1;\nallow bTick = 0;\nallow bStep = 0;\n\nwindow.launchROM_SOUNDPAD = collect(payload) {\n\tSYSTEM.state = 'APP';\n\tSYSTEM.activeApp = {\n\t\tupdate: collect() {\n\t\t\tif (inputs.back && !prevInputs.back) { TRUE_KERNEL_8CHIPI.sysCall_Yield(); return; }\n\t\t\tallow r = Math.floor(cursor / 8); allow c = cursor % 8;\n\t\t\tif (inputs.left && !prevInputs.left) c = (c - 1 + 8) % 8;\n\t\t\tif (inputs.right && !prevInputs.right) c = (c + 1) % 8;\n\t\t\tif (inputs.up && !prevInputs.up) r = (r - 1 + 4) % 4;\n\t\t\tif (inputs.down && !prevInputs.down) r = (r + 1) % 4;\n\t\t\tcursor = r * 8 + c;\n\t\t\t\n\t\t\tif (c < scrollCol) scrollCol = c;\n\t\t\tif (c >= scrollCol + 4) scrollCol = c - 3;\n\n\t\t\tif ((inputs.a && !prevInputs.a) || (inputs.space && !prevInputs.space) || (inputs.y && !prevInputs.y) || (inputs.b && !prevInputs.b)) {\n\t\t\t\tallow item = grid[cursor];\n\t\t\t\tif (item.isBeat) {\n\t\t\t\t\tif (item.idx === 3) { pBeat = -1; }\n\t\t\t\t\telse { pBeat = item.idx; bTick = 0; bStep = 0; }\n\t\t\t\t} else {\n\t\t\t\t\tLINEPAD.play(item.t, item.f1, item.d, 0.5, item.f2);\n\t\t\t\t}\n\t\t\t}\n\n\t\t\tif (pBeat >= 0) {\n\t\t\t\tbTick++;\n\t\t\t\tif (bTick >= bSpeeds[pBeat]) {\n\t\t\t\t\tbTick = 0;\n\t\t\t\t\tallow seq = beats[pBeat];\n\t\t\t\t\tallow note = seq[bStep];\n\t\t\t\t\tif (note !== null) {\n\t\t\t\t\t\tLINEPAD.play(note.t, note.f1, note.d, 0.5, note.f2);\n\t\t\t\t\t}\n\t\t\t\t\tbStep = (bStep + 1) % seq.length;\n\t\t\t\t}\n\t\t\t}\n\t\t},\n\t\trender: collect() {\n\t\t\tLGC.setColor("#111"); LGC.clear();\n\t\t\tLGC.setColor("#FFF"); LGC.setFont("bold 10px monospace"); LGC.text("LINEPAD 8-BIT SYNTH", 10, 15);\n\t\t\t\n\t\t\tif (scrollCol > 0) LGC.text("<", 2, 45);\n\t\t\tif (scrollCol < 4) LGC.text(">", 120, 45);\n\n\t\t\tfor (allow i=0; i<32; i++) {\n\t\t\t\tallow row = Math.floor(i/8); allow col = i % 8;\n\t\t\t\tif (col >= scrollCol && col < scrollCol + 4) {\n\t\t\t\t\tallow displayCol = col - scrollCol;\n\t\t\t\t\tallow px = 15 + displayCol * 26; allow py = 20 + row * 18;\n\t\t\t\t\tif (cursor === i) { LGC.setColor("#FFF"); LGC.rect(px-2, py-2, 24, 18); }\n\t\t\t\t\tLGC.setColor(grid[i].c); LGC.rect(px, py, 20, 14);\n\t\t\t\t\tLGC.setColor("#000"); LGC.setFont("bold 6px monospace"); \n\t\t\t\t\tallow label = grid[i].n;\n\t\t\t\t\tif (grid[i].isBeat && pBeat === grid[i].idx && Math.floor(Date.now()/200)%2===0) label = "PLY";\n\t\t\t\t\tLGC.text(label.substring(0,5), px+1, py+10);\n\t\t\t\t}\n\t\t\t}\n\t\t\tLGC.setColor("#FFF"); LGC.setFont("8px monospace");\n\t\t\tallow item = grid[cursor];\n\t\t\tif (!item.isBeat) {\n\t\t\t\tallow typeName = ["SQ-O","SAW","TRI","NOI-O","PL25","PL12","NOI-S","FM","SQ50","NOI-L"][item.t] || "???";\n\t\t\t\tLGC.text("W:"+typeName+" F:"+Math.floor(item.f1)+"->"+Math.floor(item.f2), 10, 95);\n\t\t\t} else {\n\t\t\t\tLGC.text(item.n + " SEQUENCE", 10, 95);\n\t\t\t}\n\t\t}\n\t};\n};\n[/ENGINE SOURCE CODE]\n========`;
	let spData = processRawAppBlock(soundPadLMF);
	if (spData) { spData.isHidden = true; INSTALLED_APPS.push(spData); }

	if (SYSTEM.localStorageEnabled) {
		let legacyApps = LINE_STORAGE.load('SYS_APPS');
		if (legacyApps && Array.isArray(legacyApps)) {
			APP_STORAGE.save(legacyApps);

		}

		let savedApps = APP_STORAGE.load();
		if (savedApps && Array.isArray(savedApps)) {
			savedApps.forEach(app => INSTALLED_APPS.push(app));
		}
		
		let savedMedia = MEDIA_STORAGE.load();
		if (savedMedia && Array.isArray(savedMedia)) {
			savedMedia.forEach(m => INSTALLED_MEDIA.push(m));

	applySettings();

	requestAnimationFrame(window.mainLoop); 
}

// SIMULATE 4,096 PALETTE CEILING (MSX2 / AMIGA STYLE)
function snapTo8BitColor(hex) {
    if (!hex || !hex.startsWith('#')) return hex;
    let clean = hex.replace('#', '');
    if (clean.length === 3) clean = clean.split('').map(c => c+c).join('');
    if (clean.length !== 6) return hex;
    
    let r = parseInt(clean.substring(0, 2), 16) || 0;
    let g = parseInt(clean.substring(2, 4), 16) || 0;
    let b = parseInt(clean.substring(4, 6), 16) || 0;
    
    // Snaps to 4,096 colors (16 steps per channel max)
    let step = 17; 
    let sr = Math.round(r / step) * step;
    let sg = Math.round(g / step) * step;
    let sb = Math.round(b / step) * step;
    
    return '#' + sr.toString(16).padStart(2,'0') + sg.toString(16).padStart(2,'0') + sb.toString(16).padStart(2,'0');
}

// OVERRIDING GRAPHICS FUNCTIONS FOR AUTHENTIC DEGRADATION (OPTIMIZED V2)
(function() {
    function to8BitInt(num) { return Math.floor(num) & 0xFF; }
    function bitMultiply(a, b) { let res = 0; for (let i = 0; i < b; i++) res = to8BitInt(res + a); return res; }
    function bitSquareRoot(num) {
        let res = 0; let bit = 1 << 6; 
        while (bit > num) bit >>= 2;
        while (bit !== 0) {
            if (num >= res + bit) { num = to8BitInt(num - (res + bit)); res = to8BitInt((res >> 1) + bit); } else { res >>= 1; }
            bit >>= 2;
        } return res;
    }
    const originalHypot = Math.hypot;
    Math.hypot = function(dx, dy) {
        if (typeof SYSTEM !== 'undefined' && SYSTEM.real8BitMode && SYSTEM.chipMode === 0) {
            let x = to8BitInt(Math.abs(dx)); let y = to8BitInt(Math.abs(dy));
            return bitSquareRoot(to8BitInt(bitMultiply(x, x) + bitMultiply(y, y)));
        }
        return originalHypot(dx, dy);
    };
})();

function compileBASICtoCH81(code) {
	let lines = code.split('\n').map(l => l.trim().toUpperCase()).filter(l => l.length > 0); let bytecode = []; let labels = {}; let unresolvedJumps = []; let offset = 0x0200; 
	const getReg = (v) => { if(v>='A' && v<='G') return v.charCodeAt(0) - 65; return 0; };
	const supportedCmds = ['CLS', 'UPDATE', 'HALT', 'LET', 'ADD', 'SUB', 'PSET', 'DRAW', 'GOTO', 'IF', 'RND', 'KEY', 'COL', 'RECT', 'LMV'];
	for(let line of lines) {
		let parts = line.split(/\s+/); let lineNum = parseInt(parts[0]);
		if (!isNaN(lineNum)) { labels[lineNum] = offset; parts.shift(); }
		if (parts.length === 0) continue;
		let cmd = parts[0]; if (!supportedCmds.includes(cmd)) throw new Error(`UNSUPPORTED KEYWORD: ${cmd}`);
		if (cmd === 'CLS') { bytecode.push(0xE1); offset += 1; } else if (cmd === 'UPDATE') { bytecode.push(0xE0); offset += 1; } else if (cmd === 'HALT') { bytecode.push(0xFF); offset += 1; } 
		else if (cmd === 'LET') { let reg = getReg(parts[1]); let val = parts[3]; if (val >= 'A' && val <= 'G') { bytecode.push(0x02, reg, getReg(val)); offset += 3; } else { bytecode.push(0x01, reg, parseInt(val)&0xFF); offset += 3; } } 
		else if (cmd === 'ADD') { let reg = getReg(parts[1].replace(',','')); let val = parts[2]; if (val >= 'A' && val <= 'G') { bytecode.push(0x10, reg, getReg(val)); offset += 3; } else { bytecode.push(0x11, reg, parseInt(val)&0xFF); offset += 3; } } 
		else if (cmd === 'SUB') { let reg = getReg(parts[1].replace(',','')); let reg2 = getReg(parts[2]); bytecode.push(0x12, reg, reg2); offset += 3; } 
		else if (cmd === 'PSET') { let rx = getReg(parts[1].replace(',','')); let ry = getReg(parts[2]); bytecode.push(0xE3, rx, ry); offset += 3; } 
		else if (cmd === 'DRAW') { let char = parts[1].replace(/["',]/g, ''); let rx = getReg(parts[2].replace(',','')); let ry = getReg(parts[3]); bytecode.push(0xE4, char.charCodeAt(0), rx, ry); offset += 4; } 
		else if (cmd === 'GOTO') { let target = parseInt(parts[1]); bytecode.push(0x20, 0x00, 0x00); unresolvedJumps.push({ idx: bytecode.length - 2, target: target }); offset += 3; } 
		else if (cmd === 'IF') { let reg = getReg(parts[1]); let val = parseInt(parts[3]); let target = parseInt(parts[5]); bytecode.push(0x30, reg, val&0xFF); offset += 3; bytecode.push(0x21, 0x00, 0x00); unresolvedJumps.push({ idx: bytecode.length - 2, target: target }); offset += 3; } 
		else if (cmd === 'RND') { let reg = getReg(parts[1].replace(',','')); let mask = parseInt(parts[2]); bytecode.push(0xC0, reg, mask&0xFF); offset += 3; } 
		else if (cmd === 'KEY') { let reg = getReg(parts[1]); bytecode.push(0x60, reg); offset += 2; }
		else if (cmd === 'COL') { let reg = getReg(parts[1]); bytecode.push(0xE2, reg); offset += 2; }
		else if (cmd === 'RECT') { let rx = getReg(parts[1].replace(',','')); let ry = getReg(parts[2].replace(',','')); let rw = getReg(parts[3].replace(',','')); let rh = getReg(parts[4]); bytecode.push(0xE5, rx, ry, rw, rh); offset += 5; }
		else if (cmd === 'LMV') { let p = parseInt(parts[1].replace(',','')); let rx = getReg(parts[2].replace(',','')); let ry = getReg(parts[3].replace(',','')); let rw = getReg(parts[4]); bytecode.push(0xE6, p, rx, ry, rw); offset += 5; }
	}
	for (let jmp of unresolvedJumps) { let addr = labels[jmp.target]; if (addr !== undefined) { bytecode[jmp.idx] = (addr >> 8) & 0xFF; bytecode[jmp.idx + 1] = addr & 0xFF; } }
	return bytecode.map(b => b.toString(16).padStart(2, '0').toUpperCase()).join('');
};

function processRawAppBlock(blockStr) {
	let b = blockStr.trim(); if (!b) return null;
	let isEPRG = /eprg_install/i.test(b) && /eprg_verify/i.test(b) && /SYS_CALL:0x[0-9A-F]{4}/i.test(b);
	let runMatch = b.match(/run\(\s*([a-zA-Z0-9_]+)\s*\)/i);
	let exeCmd = runMatch ? runMatch[1].replace(/[^a-zA-Z0-9_]/g, '') : null;
	
	let title = "Unknown Program", label = "program", desc = "No description available.";
	let rawLines = b.split('\n'); let headerParsed = false;
	for (let i = 0; i < rawLines.length; i++) {
		let l = rawLines[i].replace(/\r/g, '').replace(/\xA0/g, ' '); let tLine = l.trim();
		if (!headerParsed && tLine.includes("(title)")) { 
			let titleMatch = tLine.match(/^(.*?)\(title\)/i); let labelMatch = tLine.match(/\(title\)\((.*?)\)/i); 
			if (titleMatch) title = titleMatch[1].trim(); if (labelMatch) label = labelMatch[1].trim(); 
			headerParsed = true; continue; 
		}
		if (tLine.startsWith("description(")) desc = tLine.substring(12, tLine.lastIndexOf(")"));
	}
	return { title, label, desc, payload: b, isEPRG, exeCmd };
}

			update: function() {

					let actionPressed = (inputs.a && !prevInputs.a) || (inputs.b && !prevInputs.b) || (inputs.y && !prevInputs.y) || (inputs.c && !prevInputs.c);
					if (actionPressed) this.playing = !this.playing;

				let parts = fData.split(','); let ptr = 0; const pW = LGC.width/128; const pH = LGC.height/96;

					if(!p) continue; let cIdx = parseInt(p[0], 16); let count = parseInt(p.substring(1), 16); LGC.ctx.fillStyle = LMV_COLORS_HEX[cIdx];
					while(count > 0) { let x = ptr % 128; let y = Math.floor(ptr / 128); let spaceLeftInRow = 128 - x; let drawLen = Math.min(count, spaceLeftInRow); LGC.rawRect(x * pW, y * pH, drawLen * pW, pH); ptr += drawLen; count -= drawLen; }

function encodeLMT(str) {
	let out = []; for (let i = 0; i < str.length; i++) { let c = str.charAt(i); if (/[a-z]/.test(c)) out.push(c.charCodeAt(0) - 96); else if (/[A-Z]/.test(c)) out.push(c.charCodeAt(0) - 64 + 26); else if (/[0-9]/.test(c)) out.push('n' + c); else if (c === ' ') out.push('SPC'); else if (c === '\n') out.push('NLN'); else if (c === '-') out.push('DSH'); else out.push('x' + c.charCodeAt(0).toString(16).toUpperCase()); } return out.join('-');
}

function decodeLMT(str) {
	let parts = str.split('-'); let res = "";
	for (let i = 0; i < parts.length; i++) { let p = parts[i]; if (!p) continue; if (p === 'SPC') res += ' '; else if (p === 'NLN') res += '\n'; else if (p === 'DSH') res += '-'; else if (p.startsWith('n')) res += p.substring(1); else if (p.startsWith('x')) res += String.fromCharCode(parseInt(p.substring(1), 16)); else if (/^\d+$/.test(p)) { let val = parseInt(p); if (val >= 1 && val <= 26) res += String.fromCharCode(val + 96); else if (val >= 27 && val <= 52) res += String.fromCharCode(val - 26 + 64); } else res += p; } return res;
}

    CUSTOM_APP.barriers = false; CUSTOM_APP.grid.active = false; CUSTOM_APP.tictactoe = false; CUSTOM_APP.score = 0; CUSTOM_APP.condition = null;
    CUSTOM_APP.player.x = 64; CUSTOM_APP.player.y = 48;
    CUSTOM_APP.tttBoard = [[0,0,0],[0,0,0],[0,0,0]]; CUSTOM_APP.tttWinner = 0; CUSTOM_APP.tttMode = 'manual';

    let lines = code.split('\n');
    let cMenu = 'main';

    for(let line of lines) {
        line = line.trim();
        if(!line) continue;
        let lower = line.toLowerCase();

        if (lower.startsWith('screendraw title')) {
            let match = line.match(/\((.*?)\)/);
            if (match && CUSTOM_APP.menus[cMenu]) CUSTOM_APP.menus[cMenu].title = match[1];
        } else if (line.match(/^\d+(e\d+)?\./)) {
            let m = line.match(/^(\d+)e(\d+)\./);
            if (m) {
                let parentId = m[1]; let subMenuId = 'sub_' + parentId;
                if (!CUSTOM_APP.menus[subMenuId]) CUSTOM_APP.menus[subMenuId] = { title: 'EXTRA MENU', options: [], parent: 'main' };
                CUSTOM_APP.menus[subMenuId].options.push({ text: line.substring(line.indexOf('.')+1).trim(), raw: line });
                cMenu = subMenuId;
            } else {
                let m2 = line.match(/^(\d+)\./);
                if (m2) {
                    cMenu = 'main';
                    CUSTOM_APP.menus['main'].options.push({ text: line.substring(line.indexOf('.')+1).trim(), raw: line, id: m2[1] });
                }
            }
        } else if (lower.startsWith('screendraw grid')) {
            CUSTOM_APP.grid.active = true;
            let size = line.match(/\((\d+)\)/);
            if(size) CUSTOM_APP.grid.size = parseInt(size[1]) / 10;
        } else if (lower.startsWith('screendraw spawn')) {
            CUSTOM_APP.player.x = 64; CUSTOM_APP.player.y = 48;
        } else if (lower.startsWith('screendraw') && lower.includes('move')) {
            let parts = lower.split(' ');
            if (parts.length > 1) CUSTOM_APP.player.shape = parts[1].charAt(0).toUpperCase() + parts[1].slice(1);
        } else if (lower.startsWith('logic.move(360)')) {
            CUSTOM_APP.player.canMove360 = true;
        } else if (lower.startsWith('screendraw collect objective')) {
            CUSTOM_APP.objectives.push({ active: true, x: Math.random()*100+10, y: Math.random()*70+10 });
        } else if (lower.startsWith('screendraw auto barrier')) {
            CUSTOM_APP.barriers = true;
        } else if (lower.includes('parallel lines')) {
            CUSTOM_APP.tictactoe = true;
        } else if (lower.startsWith('logic.place(auto-place)')) {
            CUSTOM_APP.tttMode = 'auto';
        } else if (lower.startsWith('condition')) {
            let match = line.match(/\((.*?)\)/);
            if(match) CUSTOM_APP.condition = match[1];
        }
    }
    CUSTOM_APP.currentMenu = 'main'; CUSTOM_APP.menuCursor = 0;
    
    // Automatically skip menu if none configured and TTT mode is on
    if(CUSTOM_APP.menus['main'].options.length === 0 && CUSTOM_APP.tictactoe) {
        CUSTOM_APP.gameState = 'tictactoe';
    }
}

window.updateCustomApp = function() {
    CUSTOM_APP.frameCount++;
    if(CUSTOM_APP.gameState === 'menu') {
        let menu = CUSTOM_APP.menus[CUSTOM_APP.currentMenu];
        if(!menu || !menu.options || menu.options.length === 0) {
            if((inputs.a && !prevInputs.a) || (inputs.space && !prevInputs.space)) CUSTOM_APP.gameState = CUSTOM_APP.tictactoe ? 'tictactoe' : 'game';
            return;
        }
        if (inputs.down && !prevInputs.down) CUSTOM_APP.menuCursor = (CUSTOM_APP.menuCursor + 1) % menu.options.length;
        if (inputs.up && !prevInputs.up) CUSTOM_APP.menuCursor = (CUSTOM_APP.menuCursor - 1 + menu.options.length) % menu.options.length;
        if (inputs.back && !prevInputs.back && CUSTOM_APP.currentMenu !== 'main') {
            CUSTOM_APP.currentMenu = menu.parent || 'main'; CUSTOM_APP.menuCursor = 0;
        }

        if((inputs.a && !prevInputs.a) || (inputs.space && !prevInputs.space)) {
            let sel = menu.options[CUSTOM_APP.menuCursor];
            let lText = sel.raw.toLowerCase();
            
            if (lText.includes('(menu with options)')) {
                let subId = 'sub_' + sel.id;
                if (CUSTOM_APP.menus[subId]) { CUSTOM_APP.currentMenu = subId; CUSTOM_APP.menuCursor = 0; }
            } else if (lText.includes('(menu to text)')) {
                CUSTOM_APP.gameState = 'text';
                CUSTOM_APP.textScreenContent = sel.text.replace(/\(.*?\)/g, '').trim();
                CUSTOM_APP.textScreenAnim = lText.includes('(flashing)') ? 'flashing' : 
                                            lText.includes('(slide)') ? 'slide' : 
                                            lText.includes('(fade in)') ? 'fadein' : 
                                            lText.includes('(fade out)') ? 'fadeout' : '';
                CUSTOM_APP.frameCount = 0;
            } else if (lText.includes('(menu to game)')) {
                CUSTOM_APP.gameState = CUSTOM_APP.tictactoe ? 'tictactoe' : 'game';
            } else {
                CUSTOM_APP.gameState = CUSTOM_APP.tictactoe ? 'tictactoe' : 'game';
            }
        }
    } else if (CUSTOM_APP.gameState === 'text') {
        if(inputs.back && !prevInputs.back) CUSTOM_APP.gameState = 'menu';
    } else if(CUSTOM_APP.gameState === 'game') {
        if(CUSTOM_APP.player.canMove360) {
            if (inputs.up || inputs.w) CUSTOM_APP.player.y -= CUSTOM_APP.player.speed;
            if (inputs.down || inputs.s) CUSTOM_APP.player.y += CUSTOM_APP.player.speed;
            if (inputs.left || inputs.a_key) CUSTOM_APP.player.x -= CUSTOM_APP.player.speed;
            if (inputs.right || inputs.d) CUSTOM_APP.player.x += CUSTOM_APP.player.speed;
        }
        if(CUSTOM_APP.barriers) {
            if(CUSTOM_APP.player.x < 4) CUSTOM_APP.player.x = 4;
            if(CUSTOM_APP.player.x > 124) CUSTOM_APP.player.x = 124;
            if(CUSTOM_APP.player.y < 4) CUSTOM_APP.player.y = 4;
            if(CUSTOM_APP.player.y > 92) CUSTOM_APP.player.y = 92;
        }
        for(let obj of CUSTOM_APP.objectives) {
            if(obj.active && Math.abs(CUSTOM_APP.player.x - obj.x) < 8 && Math.abs(CUSTOM_APP.player.y - obj.y) < 8) {
                obj.active = false; CUSTOM_APP.score += 1;
            }
        }
        if(inputs.back && !prevInputs.back) { CUSTOM_APP.gameState = 'menu'; return; }
    } else if(CUSTOM_APP.gameState === 'tictactoe') {
        if(inputs.back && !prevInputs.back) { CUSTOM_APP.gameState = 'menu'; return; }
        if (CUSTOM_APP.tttWinner === 0) {
            if (inputs.right && !prevInputs.right) CUSTOM_APP.tttCursor.x = Math.min(2, CUSTOM_APP.tttCursor.x + 1);
            if (inputs.left && !prevInputs.left) CUSTOM_APP.tttCursor.x = Math.max(0, CUSTOM_APP.tttCursor.x - 1);
            if (inputs.down && !prevInputs.down) CUSTOM_APP.tttCursor.y = Math.min(2, CUSTOM_APP.tttCursor.y + 1);
            if (inputs.up && !prevInputs.up) CUSTOM_APP.tttCursor.y = Math.max(0, CUSTOM_APP.tttCursor.y - 1);

            if (CUSTOM_APP.tttMode === 'manual') {
                if ((inputs.a && !prevInputs.a) || (inputs.space && !prevInputs.space)) {
                    if (CUSTOM_APP.tttBoard[CUSTOM_APP.tttCursor.y][CUSTOM_APP.tttCursor.x] === 0) {
                        CUSTOM_APP.tttBoard[CUSTOM_APP.tttCursor.y][CUSTOM_APP.tttCursor.x] = 1; checkTTTWinner();
                    }
                }
                if (inputs.b && !prevInputs.b) {
                    if (CUSTOM_APP.tttBoard[CUSTOM_APP.tttCursor.y][CUSTOM_APP.tttCursor.x] === 0) {
                        CUSTOM_APP.tttBoard[CUSTOM_APP.tttCursor.y][CUSTOM_APP.tttCursor.x] = 2; checkTTTWinner();
                    }
                }
            } else if (CUSTOM_APP.tttMode === 'auto') {
                if ((inputs.a && !prevInputs.a) || (inputs.space && !prevInputs.space)) {
                    if (CUSTOM_APP.tttBoard[CUSTOM_APP.tttCursor.y][CUSTOM_APP.tttCursor.x] === 0) {
                        CUSTOM_APP.tttBoard[CUSTOM_APP.tttCursor.y][CUSTOM_APP.tttCursor.x] = CUSTOM_APP.tttTurn;
                        CUSTOM_APP.tttTurn = CUSTOM_APP.tttTurn === 1 ? 2 : 1; 
                        checkTTTWinner();
                    }
                }
            }
        }
    }
};

function checkTTTWinner() {
    let b = CUSTOM_APP.tttBoard;
    for(let i=0;i<3;i++) {
        if(b[i][0] !== 0 && b[i][0] === b[i][1] && b[i][1] === b[i][2]) CUSTOM_APP.tttWinner = b[i][0];
        if(b[0][i] !== 0 && b[0][i] === b[1][i] && b[1][i] === b[2][i]) CUSTOM_APP.tttWinner = b[0][i];
    }
    if(b[0][0] !== 0 && b[0][0] === b[1][1] && b[1][1] === b[2][2]) CUSTOM_APP.tttWinner = b[0][0];
    if(b[0][2] !== 0 && b[0][2] === b[1][1] && b[1][1] === b[2][0]) CUSTOM_APP.tttWinner = b[0][2];
}

function renderCustomApp() {
    LGC.setColor(SYSTEM.colorMode ? "#FFF" : "#b4b4b4");
    LGC.clear();
    LGC.setColor(SYSTEM.colorMode ? "#000" : "#111");

    if(CUSTOM_APP.gameState === 'menu') {
        let menu = CUSTOM_APP.menus[CUSTOM_APP.currentMenu];
        if(menu) {
            LGC.setFont("bold 10px monospace");
            LGC.text(menu.title || "SCREENDRAW MENU", 10, 20);
            LGC.setFont("8px monospace");
            let y = 35;
            for(let i=0; i<menu.options.length; i++) {
                let opt = menu.options[i];
                let cleanOpt = opt.text.replace(/\(.*?\)/g, '').trim();
                let isFlashing = opt.raw.toLowerCase().includes('(flashing)');
                if(isFlashing && (CUSTOM_APP.frameCount % 20) < 10) { y+=10; continue; }
                let isSlide = opt.raw.toLowerCase().includes('(slide)');
                let drawX = 15;
                if(isSlide) drawX += Math.sin(CUSTOM_APP.frameCount/10)*5;
                
                if (i === CUSTOM_APP.menuCursor) LGC.text(">", drawX - 10, y);
                LGC.text(cleanOpt, drawX, y);
                y += 10;
            }
        }
    } else if (CUSTOM_APP.gameState === 'text') {
        let txt = CUSTOM_APP.textScreenContent;
        let drawX = 10; let drawY = 48; let drawText = true;
        if (CUSTOM_APP.textScreenAnim === 'flashing') {
            if ((CUSTOM_APP.frameCount % 20) < 10) drawText = false;
        } else if (CUSTOM_APP.textScreenAnim === 'slide') {
            drawX += Math.sin(CUSTOM_APP.frameCount/10)*15;
        } else if (CUSTOM_APP.textScreenAnim === 'fadein') {
            if (CUSTOM_APP.frameCount < 30 && (CUSTOM_APP.frameCount % 2 === 0)) drawText = false;
        } else if (CUSTOM_APP.textScreenAnim === 'fadeout') {
            if (CUSTOM_APP.frameCount > 30 && (CUSTOM_APP.frameCount % 2 === 0)) drawText = false;
            if (CUSTOM_APP.frameCount > 60) drawText = false;
        }
        if (drawText) { LGC.setFont("10px monospace"); LGC.text(txt, drawX, drawY); }
        LGC.setFont("8px monospace"); LGC.text("ESC: BACK", 2, 94);
    } else if(CUSTOM_APP.gameState === 'game') {
        if(CUSTOM_APP.grid.active) {
            LGC.setColor(SYSTEM.colorMode ? "#ddd" : "#888"); let s = CUSTOM_APP.grid.size || 10;
            for(let i=0; i<=128; i+=s) LGC.line(i, 0, i, 96);
            for(let i=0; i<=96; i+=s) LGC.line(0, i, 128, i);
            LGC.setColor(SYSTEM.colorMode ? "#000" : "#111");
        }
        for(let obj of CUSTOM_APP.objectives) { if(obj.active) { LGC.fillCircle(obj.x, obj.y, 2); LGC.circle(obj.x, obj.y, 4); } }
        let px = CUSTOM_APP.player.x; let py = CUSTOM_APP.player.y;
        if(CUSTOM_APP.player.shape.toLowerCase() === 'triangle') LGC.fillTriangle(px, py-4, px-4, py+4, px+4, py+4);
        else if (['circle', 'sphere', 'oval'].includes(CUSTOM_APP.player.shape.toLowerCase())) LGC.fillCircle(px, py, 4);
        else LGC.rect(px - 4, py - 4, 8, 8); 
        LGC.setFont("bold 8px monospace"); LGC.text("SCORE: " + CUSTOM_APP.score, 2, 8);
    } else if(CUSTOM_APP.gameState === 'tictactoe') {
        LGC.line(50, 10, 50, 86); LGC.line(78, 10, 78, 86);
        LGC.line(22, 35, 106, 35); LGC.line(22, 61, 106, 61);
        LGC.setFont("10px monospace");
        for(let y=0; y<3; y++) {
            for(let x=0; x<3; x++) {
                let px = 30 + (x * 28); let py = 25 + (y * 25);
                let v = CUSTOM_APP.tttBoard[y][x];
                if (v === 1) LGC.text("X", px, py);
                else if (v === 2) LGC.text("O", px, py);
                if (CUSTOM_APP.tttWinner === 0 && x === CUSTOM_APP.tttCursor.x && y === CUSTOM_APP.tttCursor.y) {
                    if (Math.floor(Date.now() / 200) % 2 === 0) LGC.strokeRect(px - 6, py - 12, 20, 20);
                }
            }
        }
        LGC.setFont("8px monospace");
        if(CUSTOM_APP.tttWinner !== 0) LGC.text("WINNER: " + (CUSTOM_APP.tttWinner===1?'X':'O'), 20, 8);
        else {
            if (CUSTOM_APP.tttMode === 'manual') LGC.text("MANUAL: A=X B=O", 2, 8);
            else LGC.text("AUTO TURN: " + (CUSTOM_APP.tttTurn===1?'X':'O'), 2, 8);
        }
        if(CUSTOM_APP.condition) LGC.text(CUSTOM_APP.condition, 2, 94);
    }
}

function triggerLMTBoot(app) {

}

function finalizeAppLaunch(app) {
	window.__current_payload = app.payload;
	if (!TRUE_KERNEL_8CHIPI.verifyPayload(app.payload)) { SYSTEM.panic("UNAUTHORIZED KERNEL CALL"); return; }
	let payload = app.payload.startsWith("LMT::") ? decodeLMT(app.payload.replace("LMT::", "")) : app.payload;

	if (payload.includes("enable_screen_only") || payload.includes("screen_only_mode")) {
		SYSTEM.screenOnly = true;
		applySettings();
	}
	
	if (payload.includes("[LMV_PAYLOAD]") || payload.includes("[LMP_PAYLOAD]")) { executeMediaPlayback(payload, payload.includes("[LMV_PAYLOAD]") ? "LMV" : "LMP"); return; }

	let isCRT16 = payload.includes("CRT_16_run") || payload.includes("Custom_16bit_graphics") || payload.includes("LGC.drawLGM"); 
	let isCRT8 = payload.includes("8bit_crt_chip"); 
	let use128kb = payload.includes("utilize_128kb"); 
	let use256kb = payload.includes("utilize_256kb") || payload.includes("utilize_256"); 
	let disp240p = payload.includes("display_240p") || payload.includes("display_240") || (typeof SYSTEM !== 'undefined' && SYSTEM.perma240); 
	let hasLGM = payload.includes("LGC.drawLGM"); 
	let requiresCRT = isCRT16 || isCRT8 || use128kb || use256kb || hasLGM;

    if (requiresCRT && SYSTEM.chipMode === 0) { 
		if (hasLGM) SYSTEM.panic("ERR: LGM MODE REQ. USE CRT CHIP."); 
		else SYSTEM.panic("ERR: CRT/16-BIT CODE. USE CRT CHIP."); 
		return; 
	}
	
	if (!requiresCRT && SYSTEM.chipMode > 0) { 
		SYSTEM.panic("ERR: 8-BIT LINE 8 CODE. SWITCH TO LINE 8 CHIP (OR ADD 8bit_crt_chip)."); 
		return; 
	} else if (isCRT8 && SYSTEM.chipMode > 0) { 
		SYSTEM.notification = "SMART VM: 8-BIT COMPATIBILITY"; 
		SYSTEM.notifTimer = 180; 
	} else if (isCRT16 && SYSTEM.chipMode > 0) { 
		SYSTEM.notification = "16-BIT GRAPHICS ENABLED"; 
		SYSTEM.notifTimer = 180; 
	}

	let autoSwitch = payload.includes("Auto_Switch128/240p");
	if (autoSwitch && disp240p && SYSTEM.resolution === 0) { SYSTEM.resolution = 1; applySettings(); SYSTEM.notification = "AUTO-SWITCH: 240P"; SYSTEM.notifTimer=180; }
	else if (autoSwitch && !disp240p && SYSTEM.resolution === 1) { SYSTEM.resolution = 0; applySettings(); SYSTEM.notification = "AUTO-SWITCH: 128P"; SYSTEM.notifTimer=180; }
	else if (disp240p && SYSTEM.resolution === 0) { SYSTEM.panic("ERR: 240P REQ. CHANGE RES TO 240P IN HARDWARE SETTINGS."); return; }
	else if (!disp240p && SYSTEM.resolution === 1 && !payload.includes("enable_screen_only")) { SYSTEM.panic("ERR: 128P REQ. CHANGE RES TO 128P IN HARDWARE SETTINGS."); return; }

    // REAL MEMORY MODE vs NORMAL SMART VM AUTO-SWITCHING
	if (typeof HARDWARE_MEM_ENFORCER !== 'undefined' && HARDWARE_MEM_ENFORCER.isActive()) {
		if (!HARDWARE_MEM_ENFORCER.mountProgramToChipRAM(app.title, payload)) {
			return;
		}
	} else {
		// Normal Line VM behavior when REAL MEMORY MODE is OFF
		if (use256kb && SYSTEM.chipMode !== 2) {
			SYSTEM.chipMode = 2; applySettings();
			SYSTEM.notification = "AUTO-SWITCH: CRT 256KB"; SYSTEM.notifTimer = 180;
		} else if (use128kb && SYSTEM.chipMode !== 1 && !use256kb) {
			SYSTEM.chipMode = 1; applySettings();
		}
	}
        
	let exeCmd = app.exeCmd;
	let tFunc = exeCmd ? TRUE_KERNEL_8CHIPI.appRegistry[exeCmd] : null;

	let scriptMatch = payload.match(/\[ENGINE SOURCE CODE\]([\s\S]*?)\[\/ENGINE SOURCE CODE\]/i);
	if (scriptMatch) {
		let safeCode = scriptMatch[1].replace(/\xA0/g, ' ').replace(/\bsection\b/g, 'var').replace(/\bcollect\b/g, 'function').replace(/\ballow\b/g, 'var').replace(/\bconst\b/g, 'var').replace(/\blet\b/g, 'var');
		try { let el = document.createElement('script'); el.textContent = "(function(){" + safeCode + "})();"; document.head.appendChild(el); } catch(e) {}
		
		if (!tFunc || typeof window[tFunc] !== 'function') {
		    let directMatch = safeCode.match(/window\.(launch[a-zA-Z0-9_]+)\s*=/i);
		    if (directMatch) {
		        tFunc = directMatch[1];
		    } else if (exeCmd) {
		        let sKey = exeCmd.replace("ROM_", "").toLowerCase();
		        for (let k in window) { if (typeof window[k] === 'function' && k.toLowerCase().includes("launch") && k.toLowerCase().includes(sKey)) { tFunc = k; break; } }
		    }
		}
	}

	let ch81Match = payload.match(/\[CH81_PAYLOAD\]([\s\S]*?)\[\/CH81_PAYLOAD\]/i);
	if (ch81Match && exeCmd) { window[`__SYS_MEM_${exeCmd}`] = ch81Match[1].replace(/\s/g, ''); tFunc = "launchNativeCH81"; }

	if (payload.includes("Board_identifier")) {
		if (!window.BOARD_MANAGER || !window.BOARD_MANAGER.initFromPayload(payload)) {
			SYSTEM.panic("BOARD DECODER FAILED: 0 VALID BOARDS");
			return;
		}
	}

	if (tFunc && typeof window[tFunc] === 'function') { window[tFunc](payload.replace(/Board_identifier/gi, '')); } 
	else if (payload.toLowerCase().includes('screendraw')) {
        let scriptContent = payload;
        let scriptMatch = payload.match(/\[ENGINE SOURCE CODE\]([\s\S]*?)\[\/ENGINE SOURCE CODE\]/i);
        if (scriptMatch) scriptContent = scriptMatch[1];
        parseLMFCode(scriptContent);
        SYSTEM.state = 'CUSTOM_APP';
    } else if (!payload.includes("[ENGINE SOURCE CODE]") && !payload.includes("[CH81_PAYLOAD]")) { parseLMFCode_LEGACY(payload); SYSTEM.state = 'CUSTOM_APP'; }
	else { SYSTEM.panic("REGISTRY ERROR: FUNC NOT FOUND"); }
}

document.getElementById('file-loader').addEventListener('change', function(e) {
	const file = e.target.files[0]; if (!file) return; const ext = file.name.split('.').pop().toLowerCase();
	if (ext === 'bas') {
		const reader = new FileReader();
		reader.onload = function(evt) {
			try {
				let hexStr = window.compileBASICtoCH81(evt.target.result); if (!hexStr || hexStr.length === 0) throw new Error("NO VALID BYTECODE");
				let appName = file.name.replace(/\.[^/.]+$/, "").toUpperCase().replace(/[^A-Z0-9]/g, '').substring(0, 15); let virtualLMF = `${appName} (title)(BASIC)\nSYS_CALL:0x11C3\ndescription(Compiled BASIC application. Ext: .bas)\nrun(ROM_${appName})\n[CH81_PAYLOAD]\n${hexStr}\n[/CH81_PAYLOAD]\n========`;
				if (SYSTEM.state === 'INSTALLER') { INSTALLER_APP.buffer = virtualLMF; INSTALLER_APP.log = `COMPILED .BAS SCRIPT TO CH81 VRAM.`; } else { modalInput.value = virtualLMF; modalStatus.innerHTML = `BASIC SOURCE COMPILED TO MACHINE CODE.`; }
			} catch(err) { if (SYSTEM.state === 'INSTALLER') INSTALLER_APP.log = `COMPILER ERR: ${err.message.substring(0,25)}`; else { modalStatus.innerHTML = `COMPILER ERR: ${err.message}`; } }
		}; reader.readAsText(file);
	} else if (ext === 'ch8' || ext === 'ch81') {
		const reader = new FileReader();

LGC.drawVRAM = function(baseAddress, w = 128, h = 96, ignoreBlack = false) {
    if (typeof HARDWARE_MEM_ENFORCER !== 'undefined' && HARDWARE_MEM_ENFORCER.isActive()) {
        if (!HARDWARE_MEM_ENFORCER.checkAddress(baseAddress + (w * h) - 1, "LGC.drawVRAM")) return;
    }
    this.checkLimit();
    let mem = SYSTEM.chipMode > 0 ? CRT_CHIP.memory : LINE128_MEMORY.memory;
    let mask = SYSTEM.chipMode === 2 ? 0x3FFFF : (SYSTEM.chipMode === 1 ? 0x1FFFF : 0xFFFF);
    let ptr = baseAddress & mask;
    const pW = this.width / 128;
    const pH = this.height / 96;
    for (let y = 0; y < h; y++) {
        for (let x = 0; x < w; x++) {
            if (ptr > mask) break;
            let cIdx = mem[ptr] & 0x0F; // Reads directly from the VM's memory architecture
            if (!(ignoreBlack && cIdx === 0)) {
                this.ctx.fillStyle = LMV_COLORS_HEX[cIdx];
                this.rawRect(x * pW, y * pH, pW, pH);
            }
            ptr++;
        }
    }
    this.ctx.fillStyle = this.color;
};

// ============================================================================
// --- REAL MEMORY MODE ENFORCER V2 (TRUE BANK-SWITCHING & VIRTUAL DISK SWAP) ---
// --- WHEN OFF: Standard Line VM behavior ---
// --- WHEN ON : Enforces 64KB (Z80), 128KB (CRT-128), 256KB (CRT-256) ---
// ---           + True Local Storage Virtual Disk Bank-Switching & Streaming ---
// ============================================================================
const HARDWARE_MEM_ENFORCER = {
	strictChipLock: true,
	enforceJSHeap: true,
	strictAddressBounds: true,
	allocatedProgramBytes: 0,
	allocatedHeapBytes: 0,
	vramReservedBytes: 0,
	storageMountedBytes: 0,
	peakUsedBytes: 0,
	activeProgramTitle: "",

	// Virtual Disk / Bank-Switching State
	swapDiskKey: "ZLINE_OS_SWAP_DISK",
	bankSize: 16384,        // 16KB per swappable bank (like classic Z80/MMC1 mapper)
	swapWindowAddr: 0x8000, // 0x8000 - 0xBFFF (16KB swap window in chip RAM)
	activeBankIndex: 0,
	totalBanks: 1,
	virtualDiskTotalBytes: 0,
	namedSections: {},      // Optional named sections [BANK:NAME]...[/BANK] stored on Disk
	activeSectionName: "BOOT",

	isActive: function() {
		return Boolean(typeof SYSTEM !== 'undefined' && SYSTEM.real8BitMode);
	},

	getLimitBytes: function(modeOverride) {
		const mode = (modeOverride !== undefined) ? modeOverride : SYSTEM.chipMode;
		if (mode === 2) return 262144; // 256 KB
		if (mode === 1) return 131072; // 128 KB
		return 65536;                  // 64 KB (Z80)
	},

	getLimitKB: function(modeOverride) {
		return this.getLimitBytes(modeOverride) / 1024;
	},

	getChipName: function(modeOverride) {
		const mode = (modeOverride !== undefined) ? modeOverride : SYSTEM.chipMode;
		if (mode === 2) return "CRT-256KB";
		if (mode === 1) return "CRT-128KB";
		return "LINE8-64KB";
	},

	getActiveMemoryBuffer: function() {
		return SYSTEM.chipMode > 0 ? CRT_CHIP.memory : LINE128_MEMORY.memory;
	},

	// Maximum usable program bytes per bank before VRAM reservation
	getMaxResidentProgramBytes: function() {
		const limit = this.getLimitBytes();
		const vramBytes = (SYSTEM.resolution === 1) ? (256 * 192 / 2) : (128 * 96);
		return limit - vramBytes - 0x0200;
	},

	syncChipHardwareBuffer: function() {
		if (!this.isActive()) {
			if (LINE128_MEMORY.memory.length !== 65536) {
				LINE128_MEMORY.memory = new Uint8Array(65536);
			}
			if (CRT_CHIP.memory.length !== 262144) {
				const prev = CRT_CHIP.memory;
				CRT_CHIP.memory = new Uint8Array(262144);
				CRT_CHIP.memory.set(prev.subarray(0, Math.min(prev.length, 262144)));
			}
			return;
		}

		const limit = this.getLimitBytes();
		if (SYSTEM.chipMode === 0) {
			if (LINE128_MEMORY.memory.length !== 65536) {
				LINE128_MEMORY.memory = new Uint8Array(65536);
			}
		} else {
			if (CRT_CHIP.memory.length !== limit) {
				const oldMem = CRT_CHIP.memory;
				CRT_CHIP.memory = new Uint8Array(limit);
				CRT_CHIP.memory.set(oldMem.subarray(0, Math.min(oldMem.length, limit)));
			}
		}
		if (TRUE_KERNEL_CH81 && TRUE_KERNEL_CH81.memory) {
			TRUE_KERNEL_CH81.memory = this.getActiveMemoryBuffer();
		}
	},

	getInstalledVolatileBytes: function() {
		let total = 0;
		if (typeof INSTALLED_APPS !== 'undefined') {
			for (let i = 0; i < INSTALLED_APPS.length; i++) {
				const app = INSTALLED_APPS[i];
				if (app && !app.isHidden && app.payload) {
					total += app.payload.length;
				}
			}
		}
		return total;
	},

	// Saves a large game's banks & named sections onto the Local Storage Virtual Disk
	stageToVirtualDisk: function(appTitle, fullBytesArray, sectionsMap) {
		if (!SYSTEM.localStorageEnabled) return false;
		const banks = [];
		const bSize = this.bankSize; // 16KB chunks
		for (let offset = 0; offset < fullBytesArray.length; offset += bSize) {
			const slice = fullBytesArray.slice(offset, offset + bSize);
			let str = "";
			for (let i = 0; i < slice.length; i++) {
				str += String.fromCharCode(slice[i] & 0xFF);
			}
			banks.push(btoa(str));
		}
		this.totalBanks = Math.max(1, banks.length);
		this.virtualDiskTotalBytes = fullBytesArray.length;
		this.namedSections = sectionsMap || {};

		const diskPacket = {
			title: appTitle,
			totalBytes: fullBytesArray.length,
			bankSize: bSize,
			banks: banks,
			sections: this.namedSections
		};
		try {
			localStorage.setItem(this.swapDiskKey, JSON.stringify(diskPacket));
			return true;
		} catch (e) {
			console.warn("VIRTUAL DISK SWAP FULL:", e);
			return false;
		}
	},

	// Pages a 16KB bank from the Local Storage Virtual Disk into the active chip's Swap Window
	loadBankFromDisk: function(bankIdx, targetRamAddr) {
		if (!SYSTEM.localStorageEnabled) {
			this.triggerOOM("BANK SWITCH FAILED: LOCAL STORAGE OFF");
			return false;
		}
		let rawDisk = localStorage.getItem(this.swapDiskKey);
		if (!rawDisk) return false;
		try {
			const disk = JSON.parse(rawDisk);
			if (!disk || !disk.banks || bankIdx < 0 || bankIdx >= disk.banks.length) {
				this.triggerOOM("BANK #" + bankIdx + " OUT OF RANGE (MAX " + (disk ? disk.banks.length - 1 : 0) + ")");
				return false;
			}
			const binStr = atob(disk.banks[bankIdx]);
			const mem = this.getActiveMemoryBuffer();
			const limit = this.getLimitBytes();
			const destStart = (targetRamAddr !== undefined) ? targetRamAddr : this.swapWindowAddr;

			if (destStart < 0 || destStart + binStr.length > limit) {
				this.triggerOOM("SWAP WINDOW OVERFLOW ON " + this.getChipName());
				return false;
			}

			// Clear previous swap window and page in the new 16KB bank from Local Storage
			for (let i = 0; i < disk.bankSize && (destStart + i) < limit; i++) {
				mem[destStart + i] = 0;
			}
			for (let i = 0; i < binStr.length; i++) {
				mem[destStart + i] = binStr.charCodeAt(i) & 0xFF;
			}

			this.activeBankIndex = bankIdx;
			this.storageMountedBytes = binStr.length;
			SYSTEM.notification = "DISK->RAM: BANK " + bankIdx + " (" + (binStr.length / 1024).toFixed(1) + "KB)";
			SYSTEM.notifTimer = 110;
			return true;
		} catch (e) {
			return false;

	// Loads a named section (e.g., "MAIN_MENU", "LEVEL_1", "BOSS") or LINE_STORAGE key on demand into the Swap Window
	loadSectionFromDisk: function(sectionName) {
		if (!SYSTEM.localStorageEnabled) {
			this.triggerOOM("SECTION STREAM REQ LOCAL STORAGE ON");
			return null;
		}
		let content = null;
		// Check named [BANK:NAME] sections on the virtual swap disk first
		let rawDisk = localStorage.getItem(this.swapDiskKey);
		if (rawDisk) {
			try {
				const disk = JSON.parse(rawDisk);
				if (disk && disk.sections && disk.sections[sectionName] !== undefined) {
					content = disk.sections[sectionName];
				}
			} catch (e) {}
		}
		// Fallback to LINE_STORAGE key
		if (content === null && LINE_STORAGE.volatile && LINE_STORAGE.volatile[sectionName] !== undefined) {
			const val = LINE_STORAGE.volatile[sectionName];
			content = (typeof val === 'string') ? val : JSON.stringify(val);
		}
		if (content === null) return null;

		const limit = this.getLimitBytes();
		const mem = this.getActiveMemoryBuffer();
		const destStart = this.swapWindowAddr;
		const maxSwapBytes = limit - this.vramReservedBytes - destStart;

		if (content.length > maxSwapBytes) {
			this.triggerOOM("SECTION '" + sectionName + "' (" + (content.length/1024).toFixed(1) + "KB) > SWAP WINDOW");
			return null;
		}

		for (let i = 0; i < maxSwapBytes && (destStart + i) < limit; i++) {
			mem[destStart + i] = 0;
		}
		for (let i = 0; i < content.length; i++) {
			mem[destStart + i] = content.charCodeAt(i) & 0xFF;
		}

		this.activeSectionName = sectionName;
		this.storageMountedBytes = content.length;
		SYSTEM.notification = "STREAMED [" + sectionName.substring(0, 10) + "] (" + (content.length / 1024).toFixed(1) + "KB)";
