		if (!SYSTEM.localStorageEnabled) {
			const existingVolatile = this.getInstalledVolatileBytes();
			if (baseOffset + existingVolatile + incomingBytes > limit) {
				const kbTotal = ((baseOffset + existingVolatile + incomingBytes) / 1024).toFixed(1);
				SYSTEM.notification = "RAM FULL (NO LS): " + kbTotal + "KB > " + this.getLimitKB() + "KB";
				SYSTEM.notifTimer = 220;
				if (SYSTEM.state === 'INSTALLER' && typeof INSTALLER_APP !== 'undefined') {
					INSTALLER_APP.log = "ERR: CHIP RAM FULL (" + this.getLimitKB() + "KB MAX)";
				}
				return false;
			}
		}
		return true;
	},

	// Validates a raw address; if address is in a higher bank (>= chip limit) and Local Storage is ON,
	// automatically bank-switches the corresponding 16KB bank from Local Storage into the Swap Window!
	resolveOrCheckAddress: function(addr, contextLabel) {
		if (!this.isActive() || !this.strictAddressBounds) return addr;
		const limit = this.getLimitBytes();
		if (addr < 0) {
			this.triggerOOM("NEGATIVE ADDR EXCEEDS " + this.getChipName());
			return -1;
		}
		if (addr >= limit) {
			// If the game is banked on Local Storage (e.g. 80KB game on 64KB Z80 accessing 0x10000 - 0x13FFF),
			// automatically swap the needed 16KB bank from Local Storage into the Swap Window!
			if (SYSTEM.localStorageEnabled && this.virtualDiskTotalBytes > 0 && (addr - 0x0200) < this.virtualDiskTotalBytes) {
				const logicalOffset = addr - 0x0200;
				const targetBank = Math.floor(logicalOffset / this.bankSize);
				const offsetWithinBank = logicalOffset % this.bankSize;
				if (targetBank !== this.activeBankIndex) {
					if (!this.loadBankFromDisk(targetBank, this.swapWindowAddr)) return -1;
				}
				return this.swapWindowAddr + offsetWithinBank;
			}
			this.triggerOOM(
				"ADDR 0x" + Math.max(0, addr).toString(16).toUpperCase() +
				" EXCEEDS " + this.getChipName() + " (" + this.getLimitKB() + "KB)"
			);
			return -1;
		}
		return addr;
	},

	checkAddress: function(addr, contextLabel) {
		return this.resolveOrCheckAddress(addr, contextLabel) !== -1;
	},

	// Mounts a Game, ROM (.ch8/.ch81/.bas), or EPRG into physical chip RAM.
	// - Does NOT dump all of LINE_STORAGE into RAM at boot (fixes boot save bloat).
	// - If game > active chip RAM and Local Storage is ON, stores the full game on the Virtual Disk,
	//   loads up to the chip's RAM capacity (Bank 0 + initial resident banks), and pages the rest on demand!
	mountProgramToChipRAM: function(appTitle, rawPayload) {
		if (!this.isActive()) return true;

		this.syncChipHardwareBuffer();
		const limit = this.getLimitBytes();
		const mem = this.getActiveMemoryBuffer();
		mem.fill(0);

		this.activeProgramTitle = appTitle || "PROGRAM";
		this.allocatedProgramBytes = 0;
		this.allocatedHeapBytes = 0;
		this.vramReservedBytes = (SYSTEM.resolution === 1) ? (256 * 192 / 2) : (128 * 96);
		this.storageMountedBytes = 0;
		this.peakUsedBytes = 0;
		this.activeBankIndex = 0;
		this.totalBanks = 1;
		this.virtualDiskTotalBytes = 0;
		this.namedSections = {};

		// Swap window sits below VRAM so it never overwrites VRAM
		const vramStart = limit - this.vramReservedBytes;
		this.swapWindowAddr = Math.max(0x4000, vramStart - this.bankSize);

		let cleanPayload = rawPayload || "";

		if (SYSTEM.localStorageEnabled) {
			const savedApps = APP_STORAGE.load();
			if (savedApps && Array.isArray(savedApps)) {
				const matchFromLS = savedApps.find(a => a && a.title === appTitle);
				if (matchFromLS && matchFromLS.payload) {
					cleanPayload = matchFromLS.payload.startsWith("LMT::")
						? decodeLMT(matchFromLS.payload.replace("LMT::", ""))
						: matchFromLS.payload;
				}
			}
		}

		// Extract any explicit [BANK:SECTION_NAME]...[/BANK] blocks so only the boot code loads at startup
		// and extra levels/menus stay on Local Storage until requested!
		const extractedSections = {};
		if (SYSTEM.localStorageEnabled) {
			cleanPayload = cleanPayload.replace(/\[BANK:([a-zA-Z0-9_\-]+)\]([\s\S]*?)\[\/BANK\]/gi, function(_, secName, secBody) {
				extractedSections[secName.trim()] = secBody;
				return "";
			});
		}

		if (this.strictChipLock && !SYSTEM.localStorageEnabled) {
			const req256 = cleanPayload.includes("utilize_256kb") || cleanPayload.includes("utilize_256");
			const req128 = cleanPayload.includes("utilize_128kb");
			if (req256 && SYSTEM.chipMode < 2) {
				this.triggerOOM("REAL MEM: REQ 256KB CRT (ON " + this.getLimitKB() + "KB CHIP)");
				return false;
			}
			if (req128 && SYSTEM.chipMode < 1) {
				this.triggerOOM("REAL MEM: REQ 128KB CRT (ON " + this.getLimitKB() + "KB CHIP)");
				return false;
			}
		}

		// Convert payload into raw byte array
		const baseOffset = 0x0200;
		let rawBytes = null;

		const ch81Match = cleanPayload.match(/\[CH81_PAYLOAD\]([\s\S]*?)\[\/CH81_PAYLOAD\]/i);
		if (ch81Match) {
			const hexClean = ch81Match[1].replace(/\s/g, '');
			const byteLen = Math.ceil(hexClean.length / 2);
			rawBytes = new Uint8Array(byteLen);
			for (let i = 0; i < hexClean.length; i += 2) {
				rawBytes[i >> 1] = parseInt(hexClean.substring(i, i + 2), 16) & 0xFF;
			}
		} else {
			rawBytes = new Uint8Array(cleanPayload.length);
			for (let i = 0; i < cleanPayload.length; i++) {
				rawBytes[i] = cleanPayload.charCodeAt(i) & 0xFF;
			}
		}

		const byteFootprint = rawBytes.length;
		const maxResidentBytes = limit - this.vramReservedBytes - baseOffset;

		// CASE A: Program + VRAM fits completely inside the active chip's RAM
		if (byteFootprint <= maxResidentBytes) {
			for (let i = 0; i < byteFootprint; i++) {
				mem[baseOffset + i] = rawBytes[i];
			}
			this.allocatedProgramBytes = baseOffset + byteFootprint;
			if (SYSTEM.localStorageEnabled) {
				this.stageToVirtualDisk(this.activeProgramTitle, rawBytes, extractedSections);
			}
			SYSTEM.notification = (SYSTEM.localStorageEnabled ? "RAM+DISK: " : "RAM: ") +
				(this.allocatedProgramBytes / 1024).toFixed(1) + "/" + this.getLimitKB() + "KB";
			SYSTEM.notifTimer = 160;
			return true;
		}

		// CASE B: Program is larger than the chip's RAM (e.g. 80KB game on 64KB Z80)
		if (!SYSTEM.localStorageEnabled) {
			const totalKB = ((baseOffset + byteFootprint + this.vramReservedBytes) / 1024).toFixed(1);
			this.triggerOOM("PRG (" + totalKB + "KB) > " + this.getLimitKB() + "KB (ENABLE LS FOR BANKING)");
			return false;
		}

		// Local Storage IS ON -> Stage the entire 80KB+ game to the Local Storage Virtual Disk,
		// load the first resident portion (up to the Swap Window) into RAM, and page Bank 0 into the Swap Window!
		if (!this.stageToVirtualDisk(this.activeProgramTitle, rawBytes, extractedSections)) {
			this.triggerOOM("VIRTUAL DISK FULL: CANNOT STAGE " + (byteFootprint / 1024).toFixed(1) + "KB");
			return false;
		}

		const fixedResidentMax = Math.max(this.bankSize, this.swapWindowAddr - baseOffset);
		const copyLen = Math.min(byteFootprint, fixedResidentMax);
		for (let i = 0; i < copyLen; i++) {
			mem[baseOffset + i] = rawBytes[i];
		}

		// Load the first overflow bank into the 16KB Swap Window
		const firstSwapBank = Math.floor(copyLen / this.bankSize);
		this.loadBankFromDisk(firstSwapBank, this.swapWindowAddr);

		this.allocatedProgramBytes = baseOffset + copyLen;
		const spilledKB = ((byteFootprint - copyLen) / 1024).toFixed(1);
		SYSTEM.notification = "BANKED: " + (this.getLimitKB()) + "KB RAM + " + spilledKB + "KB ON LS";
		SYSTEM.notifTimer = 200;
		return true;
	},

	auditRuntimeMemory: function() {
		if (!this.isActive() || !this.enforceJSHeap || SYSTEM.state !== 'APP') return true;
		const limit = this.getLimitBytes();
		const mem = this.getActiveMemoryBuffer();

		let dynamicRamBytes = 0;
		const scanStart = this.allocatedProgramBytes + this.storageMountedBytes;
		for (let i = scanStart; i < limit - this.vramReservedBytes; i++) {
			if (mem[i] !== 0) dynamicRamBytes++;
		}

		let appStateBytes = 0;
		if (SYSTEM.activeApp) {
			try {
				const keys = Object.keys(SYSTEM.activeApp);
				for (let k = 0; k < keys.length; k++) {
					const val = SYSTEM.activeApp[keys[k]];
					if (Array.isArray(val)) {
						appStateBytes += val.length * 8;
					} else if (val && val.buffer instanceof ArrayBuffer) {
						appStateBytes += val.byteLength;
					} else if (typeof val === 'string') {
						appStateBytes += val.length * 2;
					}
				}
			} catch (e) {}
		}

		const totalUsed = this.allocatedProgramBytes + this.storageMountedBytes + this.vramReservedBytes + this.allocatedHeapBytes + dynamicRamBytes + appStateBytes;
		if (totalUsed > this.peakUsedBytes) this.peakUsedBytes = totalUsed;

		if (totalUsed > limit) {
			// If Local Storage is ON and dynamic data overflows, flush dynamic heap to Virtual Disk swap instead of crashing if within 1 bank
			if (SYSTEM.localStorageEnabled && this.allocatedHeapBytes > 0) {
				this.allocatedHeapBytes = 0;
				SYSTEM.notification = "RAM SWAP: FLUSHED HEAP TO LS";
				SYSTEM.notifTimer = 90;
				return true;
			}
			const usedKB = (totalUsed / 1024).toFixed(1);
			this.triggerOOM("REAL MEM OVERFLOW: " + usedKB + "KB / " + this.getLimitKB() + "KB");
			return false;
		}
		return true;
	},

	getTotalUsedBytes: function() {
		const limit = this.getLimitBytes();
		const mem = this.getActiveMemoryBuffer();
		let nonZero = 0;
		for (let i = 0; i < Math.min(limit, mem.length); i++) {
			if (mem[i] !== 0) nonZero++;
		}
		return Math.min(limit, Math.max(nonZero, this.allocatedProgramBytes + this.storageMountedBytes + this.allocatedHeapBytes));
	},

	triggerOOM: function(reason) {
		console.error("[LINE VM REAL MEMORY FAULT]", reason);
		TRUE_KERNEL_CH81.state = 'HALT';
		LINE128_MEMORY.halt = 1;
		CRT_CHIP.halt = 1;
		SYSTEM.activeApp = null;
		SYSTEM.panic(reason);
	}
};

// Hook LINE_STORAGE.load(key) so when Real Memory Mode is ON, loading a save slot/level streams ONLY that key into the Swap Window!
(function() {
	const _origLSLoad = LINE_STORAGE.load.bind(LINE_STORAGE);
	LINE_STORAGE.load = function(key) {
		const val = _origLSLoad(key);
		if (val !== undefined && typeof HARDWARE_MEM_ENFORCER !== 'undefined' && HARDWARE_MEM_ENFORCER.isActive() && SYSTEM.state === 'APP') {
			const rawStr = (typeof val === 'string') ? val : JSON.stringify(val);
			const limit = HARDWARE_MEM_ENFORCER.getLimitBytes();
			const dest = HARDWARE_MEM_ENFORCER.swapWindowAddr;
			const maxSwap = limit - HARDWARE_MEM_ENFORCER.vramReservedBytes - dest;
			if (rawStr.length > maxSwap) {
				HARDWARE_MEM_ENFORCER.triggerOOM("LS LOAD '" + key + "' (" + (rawStr.length/1024).toFixed(1) + "KB) > SWAP RAM");
				return undefined;
			}
			const mem = HARDWARE_MEM_ENFORCER.getActiveMemoryBuffer();
			for (let i = 0; i < rawStr.length && (dest + i) < limit; i++) {
				mem[dest + i] = rawStr.charCodeAt(i) & 0xFF;
			}
			HARDWARE_MEM_ENFORCER.storageMountedBytes = rawStr.length;
		}
		return val;
	};
})();

// Expose Bank-Switching & On-Demand Section Streaming APIs on window.RAM
window.RAM._getMask = function() {
	if (!HARDWARE_MEM_ENFORCER.isActive()) {
		return SYSTEM.chipMode === 2 ? 0x3FFFF : 0x1FFFF;
	}
	return SYSTEM.chipMode === 2 ? 0x3FFFF : (SYSTEM.chipMode === 1 ? 0x1FFFF : 0xFFFF);
};
window.RAM.getLimitBytes = function() {
	return HARDWARE_MEM_ENFORCER.getLimitBytes();
};
window.RAM.getUsedBytes = function() {
	return HARDWARE_MEM_ENFORCER.getTotalUsedBytes();
};
window.RAM.switchBank = function(bankIndex, targetRamAddr) {
	if (!HARDWARE_MEM_ENFORCER.isActive()) return true;
	return HARDWARE_MEM_ENFORCER.loadBankFromDisk(bankIndex, targetRamAddr);
};
window.RAM.loadSection = function(sectionName) {
	return HARDWARE_MEM_ENFORCER.loadSectionFromDisk(sectionName);
};
window.RAM.getActiveBank = function() {
	return HARDWARE_MEM_ENFORCER.activeBankIndex;
};
window.RAM.getTotalBanks = function() {
	return HARDWARE_MEM_ENFORCER.totalBanks;
};
window.RAM.alloc = function(byteCount) {
	if (!HARDWARE_MEM_ENFORCER.isActive()) {
		const ptr = HARDWARE_MEM_ENFORCER.allocatedProgramBytes + HARDWARE_MEM_ENFORCER.allocatedHeapBytes;
		HARDWARE_MEM_ENFORCER.allocatedHeapBytes += byteCount;
		return ptr & window.RAM._getMask();
	}
	const limit = HARDWARE_MEM_ENFORCER.getLimitBytes();
	const nextTotal = HARDWARE_MEM_ENFORCER.allocatedProgramBytes + HARDWARE_MEM_ENFORCER.storageMountedBytes + HARDWARE_MEM_ENFORCER.vramReservedBytes + HARDWARE_MEM_ENFORCER.allocatedHeapBytes + byteCount;
	if (nextTotal > limit) {
		HARDWARE_MEM_ENFORCER.triggerOOM("RAM.ALLOC(" + byteCount + "B) EXCEEDS " + HARDWARE_MEM_ENFORCER.getLimitKB() + "KB");
		return -1;
	}
	const ptr = HARDWARE_MEM_ENFORCER.allocatedProgramBytes + HARDWARE_MEM_ENFORCER.allocatedHeapBytes;
	HARDWARE_MEM_ENFORCER.allocatedHeapBytes += byteCount;
	return ptr;
};
window.RAM.read8 = function(addr) {
	if (HARDWARE_MEM_ENFORCER.isActive()) {
		const phys = HARDWARE_MEM_ENFORCER.resolveOrCheckAddress(addr, "RAM.read8");
		if (phys === -1) return 0;
		return SYSTEM.chipMode > 0 ? CRT_CHIP.memory[phys] : LINE128_MEMORY.memory[phys];
	}
	return SYSTEM.chipMode > 0 ? CRT_CHIP.memory[addr & this._getMask()] : LINE128_MEMORY.memory[addr & 0xFFFF];
};
window.RAM.write8 = function(addr, val) {
	if (HARDWARE_MEM_ENFORCER.isActive()) {
		// Writing to 0xFFFE / 0xFFFF (MBC-style bank register) or calling RAM.switchBank switches banks!
		if (addr === 0xFFFE && SYSTEM.localStorageEnabled && HARDWARE_MEM_ENFORCER.totalBanks > 1) {
			HARDWARE_MEM_ENFORCER.loadBankFromDisk(val & 0xFF, HARDWARE_MEM_ENFORCER.swapWindowAddr);
			return;
		}
		const phys = HARDWARE_MEM_ENFORCER.resolveOrCheckAddress(addr, "RAM.write8");
		if (phys === -1) return;
		if (SYSTEM.chipMode > 0) CRT_CHIP.memory[phys] = val & 0xFF;
		else LINE128_MEMORY.memory[phys] = val & 0xFF;
		return;
	}
	if (SYSTEM.chipMode > 0) CRT_CHIP.memory[addr & this._getMask()] = val & 0xFF;
	else LINE128_MEMORY.memory[addr & 0xFFFF] = val & 0xFF;
};
window.RAM.read16 = function(addr) {
	if (HARDWARE_MEM_ENFORCER.isActive()) {
		const phys0 = HARDWARE_MEM_ENFORCER.resolveOrCheckAddress(addr, "RAM.read16");
		const phys1 = HARDWARE_MEM_ENFORCER.resolveOrCheckAddress(addr + 1, "RAM.read16");
		if (phys0 === -1 || phys1 === -1) return 0;
		return SYSTEM.chipMode > 0
			? ((CRT_CHIP.memory[phys0] << 8) | CRT_CHIP.memory[phys1])
			: ((LINE128_MEMORY.memory[phys0] << 8) | LINE128_MEMORY.memory[phys1]);
	}
	return SYSTEM.chipMode > 0
		? (CRT_CHIP.memory[addr & this._getMask()] << 8 | CRT_CHIP.memory[(addr + 1) & this._getMask()])
		: (LINE128_MEMORY.memory[addr & 0xFFFF] << 8 | LINE128_MEMORY.memory[(addr + 1) & 0xFFFF]);
};
window.RAM.write16 = function(addr, val) {
	if (HARDWARE_MEM_ENFORCER.isActive()) {
		const phys0 = HARDWARE_MEM_ENFORCER.resolveOrCheckAddress(addr, "RAM.write16");
		const phys1 = HARDWARE_MEM_ENFORCER.resolveOrCheckAddress(addr + 1, "RAM.write16");
		if (phys0 === -1 || phys1 === -1) return;
		if (SYSTEM.chipMode > 0) {
			CRT_CHIP.memory[phys0] = (val >> 8) & 0xFF;
			CRT_CHIP.memory[phys1] = val & 0xFF;
		} else {
			LINE128_MEMORY.memory[phys0] = (val >> 8) & 0xFF;
			LINE128_MEMORY.memory[phys1] = val & 0xFF;
		}
		return;
	}
	if (SYSTEM.chipMode > 0) {
		CRT_CHIP.memory[addr & this._getMask()] = (val >> 8) & 0xFF;
		CRT_CHIP.memory[(addr + 1) & this._getMask()] = val & 0xFF;
	} else {
		LINE128_MEMORY.memory[addr & 0xFFFF] = (val >> 8) & 0xFF;
		LINE128_MEMORY.memory[(addr + 1) & 0xFFFF] = val & 0xFF;
	}
};

LINE128_MEMORY.rb = function(a) {
	if (HARDWARE_MEM_ENFORCER.isActive() && (a < 0 || a > 0xFFFF)) {
		const phys = HARDWARE_MEM_ENFORCER.resolveOrCheckAddress(a, "Z80.rb");
		if (phys !== -1) return this.memory[phys & 0xFFFF];
		return 0;
	}
	return this.memory[a & 0xFFFF];
};
LINE128_MEMORY.wb = function(a, v) {
	if (HARDWARE_MEM_ENFORCER.isActive() && (a < 0 || a > 0xFFFF)) {
		const phys = HARDWARE_MEM_ENFORCER.resolveOrCheckAddress(a, "Z80.wb");
		if (phys !== -1) this.memory[phys & 0xFFFF] = v & 0xFF;
		return;
	}
	this.memory[a & 0xFFFF] = v & 0xFF;
};

	window.updateSavManager = function() {

		let upP = (inputs.up || inputs.w) && !(prevInputs.up || prevInputs.w);
		let dnP = (inputs.down || inputs.s) && !(prevInputs.down || prevInputs.s);
		let lfP = (inputs.left || inputs.a_key) && !(prevInputs.left || prevInputs.a_key);
		let rtP = (inputs.right || inputs.d) && !(prevInputs.right || prevInputs.d);
		let actP = (inputs.a && !prevInputs.a) || (inputs.space && !prevInputs.space) || (inputs.y && !prevInputs.y);

			if (bckP) { SAV_MAN.mode = 'LIST'; return; }

			if (actP) window.executeSavActionSelect();

		if (SAV_MAN.mode === 'CONFIRM_DEL' || SAV_MAN.mode === 'CONFIRM_FORMAT') {
			if (bckP) { SAV_MAN.mode = 'LIST'; return; }
			if (lfP || rtP || upP || dnP) SAV_MAN.confirmCursor = SAV_MAN.confirmCursor === 0 ? 1 : 0;
			if (actP) window.executeSavConfirmSelect();
			return;
		}

		// LIST MODE
		let totalItems = keys.length + 3;
		if (upP) SAV_MAN.cursor = Math.max(0, SAV_MAN.cursor - 1);
		if (dnP) SAV_MAN.cursor = Math.min(totalItems - 1, SAV_MAN.cursor + 1);
		if (actP) {
			window.executeSavListSelect();
		} else if (delShortcut && SAV_MAN.cursor < keys.length) {
			SAV_MAN.targetKey = keys[SAV_MAN.cursor];
			SAV_MAN.confirmCursor = 1;
			SAV_MAN.mode = 'CONFIRM_DEL';
		}
	};

		if (SAV_MAN.mode === 'CONFIRM_DEL' || SAV_MAN.mode === 'CONFIRM_FORMAT') {
			LGC.strokeRect(6, 18, LGC.width - 12, 62);

			LGC.text("[" + label + "]", 12, 51);

    function purgeGameSaveEverywhere(rawKey) {
        if (!rawKey) return;
        const baseKey = rawKey.replace(/^PROG_/, '');
        const variants = [rawKey, baseKey, "PROG_" + baseKey];

        variants.forEach(k => {
            delete LINE_STORAGE.volatile[k];

        try {

        try {
            for (let i = localStorage.length - 1; i >= 0; i--) {
                const lk = localStorage.key(i);
                if (!lk) continue;
                if (lk === rawKey || lk === baseKey || lk === "PROG_" + baseKey) {

            LINE128_MEMORY.memory.fill(0);

            if (h.length === 3) h = h[0]+h[0]+h[1]+h[1]+h[2]+h[2];
            if (h.length === 6) {
                const n = parseInt(h, 16);
                const r = (n >> 16) & 0xFF, g = (n >> 8) & 0xFF, b = n & 0xFF;
                return ((r > 127 ? 4 : 0) | (g > 127 ? 2 : 0) | (b > 127 ? 1 : 0) | ((r + g + b) > 500 ? 8 : 0)) & 0x0F;
            }
        }
        return 3;
    }

    window.LGC_VRAM_BUS = {
        line8DefaultVramSize: 12288, // 12KB default VRAM on Line 8 Chip (0xD000 - 0xFFFF)
        codedVramBytes: 0,           // Optional developer-coded VRAM override (e.g. vram_kb(16) or RAM.setVRAMKB(16))
        tempBorrowedVramBytes: 0,    // Extra space temporarily borrowed by VRAM when 12KB runs out
        peakTempBorrowedBytes: 0,
        currentColorIdx: 1,
        frameCommandBytes: 0,
        lastClearColorIdx: 0,

        // Only Line 8 Chip (chipMode === 0) uses dedicated VRAM; CRT Chip uses 0 VRAM (open Amiga unified RAM)
        usesVram: function() {
            return SYSTEM.chipMode === 0;
        },

        getChipCapacityBytes: function() {
            return SYSTEM.chipMode === 2 ? 262144 : (SYSTEM.chipMode === 1 ? 131072 : 65536);
        },

        getActiveChipMemory: function() {
            return SYSTEM.chipMode > 0 ? CRT_CHIP.memory : LINE128_MEMORY.memory;
        },

        getProgramAndHeapBytes: function() {
            const enf = (typeof HARDWARE_MEM_ENFORCER !== 'undefined') ? HARDWARE_MEM_ENFORCER : null;
            if (!enf) return 0x0400;
            const prog = enf.allocatedProgramBytes || 0x0200;
            const heap = enf.allocatedHeapBytes || 0;
            const mounted = enf.storageMountedBytes || 0;
            return prog + heap + mounted;
        },

        // Base VRAM: 12KB (or custom coded VRAM) on Line 8 Chip; 0 bytes on CRT Chip
        getBaseVramBytes: function() {
            if (!this.usesVram()) return 0;
            return this.codedVramBytes > 0 ? this.codedVramBytes : this.line8DefaultVramSize;
        },

        // Total active VRAM = Base VRAM + any temporary extra space currently borrowed on Line 8
        getTotalVramBytes: function() {
            if (!this.usesVram()) return 0;
            return this.getBaseVramBytes() + this.tempBorrowedVramBytes;
        },

        // Shared extra free space left on the chip after (Game + Heap + Base VRAM)
        // Example: 64KB Line 8 - 37KB LMT Game = 27KB left -> 12KB Base VRAM = 15KB extra space!
        getExtraFreeSpaceBytes: function() {
            const cap = this.getChipCapacityBytes();
            const usedByGame = this.getProgramAndHeapBytes();
            const baseVram = this.getBaseVramBytes();
            return Math.max(0, cap - usedByGame - baseVram);
        },

        // Allows a developer to code custom VRAM size for Line 8 (in KB or bytes)
        setCodedVramBytes: function(bytes) {
            if (!this.usesVram()) {
                this.codedVramBytes = 0;
                this.tempBorrowedVramBytes = 0;
                if (typeof HARDWARE_MEM_ENFORCER !== 'undefined') HARDWARE_MEM_ENFORCER.vramReservedBytes = 0;
                return true;
            }
            const req = Math.max(1024, bytes | 0);
            const cap = this.getChipCapacityBytes();
            const usedByGame = this.getProgramAndHeapBytes();
            if (usedByGame + req > cap) {
                if (typeof HARDWARE_MEM_ENFORCER !== 'undefined' && HARDWARE_MEM_ENFORCER.isActive()) {
                    HARDWARE_MEM_ENFORCER.triggerOOM('CODED VRAM (' + (req/1024).toFixed(1) + 'KB) + GAME EXCEEDS 64KB');
                }
                return false;
            }
            this.codedVramBytes = req;
            this.tempBorrowedVramBytes = 0;
            if (typeof HARDWARE_MEM_ENFORCER !== 'undefined') {
                HARDWARE_MEM_ENFORCER.vramReservedBytes = req;
                window.RAM.VRAM_BASE = cap - req;
            }
            return true;
        },

        // Temporarily borrows extra free space on Line 8 if the 12KB VRAM runs out during a frame
        borrowTemporaryVram: function(extraBytesNeeded) {
            if (!this.usesVram()) return true; // CRT Chip doesn't use VRAM
            if (extraBytesNeeded <= this.tempBorrowedVramBytes) return true;
            const maxExtraSpace = this.getExtraFreeSpaceBytes();
            if (extraBytesNeeded <= maxExtraSpace) {
                this.tempBorrowedVramBytes = extraBytesNeeded;
                if (extraBytesNeeded > this.peakTempBorrowedBytes) this.peakTempBorrowedBytes = extraBytesNeeded;
                return true;
            }
            this.tempBorrowedVramBytes = maxExtraSpace;
            if (typeof HARDWARE_MEM_ENFORCER !== 'undefined' && HARDWARE_MEM_ENFORCER.isActive()) {
                HARDWARE_MEM_ENFORCER.triggerOOM('LINE 8 VRAM OVERFLOW: ' + ((this.getBaseVramBytes() + extraBytesNeeded)/1024).toFixed(1) + 'KB + GAME > 64KB');
                return false;
            }
            return false;
        },

        // Releases temporary borrowed extra space when the frame clears so the game or VRAM can use it
        releaseTemporaryVram: function() {
            if (!this.usesVram()) { this.tempBorrowedVramBytes = 0; return; }
            if (this.tempBorrowedVramBytes > 0) {
                const mem = LINE128_MEMORY.memory;
                const cap = 65536;
                const baseVram = this.getBaseVramBytes();
                const borrowStart = Math.max(this.getProgramAndHeapBytes(), cap - baseVram - this.tempBorrowedVramBytes);
                const borrowEnd = cap - baseVram;
                for (let a = borrowStart; a < borrowEnd; a += 64) mem[a] = 0;
                this.tempBorrowedVramBytes = 0;
            }
        },

        hwClearVram: function(colorIdx) {
            this.lastClearColorIdx = colorIdx & 0x0F;
            this.frameCommandBytes = 0;
            this.releaseTemporaryVram();
            if (!this.usesVram() || false) return;
            const mem = LINE128_MEMORY.memory;
            const cap = 65536;
            const baseVram = this.getBaseVramBytes();
            const vramStart = cap - baseVram;
            const byteVal = (colorIdx & 0x0F) | ((colorIdx & 0x0F) << 4);
            for (let a = vramStart; a < cap; a += 64) mem[a] = byteVal;
        },

        hwWriteRectToVram: function(x, y, w, h, colorIdx) {
            if (!this.usesVram() || false) return;
            const mem = LINE128_MEMORY.memory;
            const c = colorIdx & 0x0F;
            let x0 = x | 0, y0 = y | 0, x1 = (x0 + (w | 0)), y1 = (y0 + (h | 0));
            if (x0 < 0) x0 = 0; if (y0 < 0) y0 = 0;
            if (x1 > 128) x1 = 128; if (y1 > 96) y1 = 96;
            if (x0 >= x1 || y0 >= y1) return;
            const base = 65536 - this.getBaseVramBytes();
            mem[base + (y0 << 7) + x0] = c;
            mem[base + ((y1 - 1) << 7) + (x1 - 1)] = c;
        },

        hwRecordBlitBytes: function(byteCount) {
            if (!this.usesVram() || false) return;
            this.frameCommandBytes += byteCount;
            const baseVram = this.getBaseVramBytes();
            if (this.frameCommandBytes > baseVram) {
                const extraNeeded = this.frameCommandBytes - baseVram;
                if (this.borrowTemporaryVram(extraNeeded)) {
                    const mem = LINE128_MEMORY.memory;
                    const cap = 65536;
                    const dynStart = Math.max(this.getProgramAndHeapBytes(), cap - baseVram - this.tempBorrowedVramBytes);
                    const writePos = dynStart + (this.frameCommandBytes % Math.max(1, this.tempBorrowedVramBytes));
                    if (writePos >= 0 && writePos < cap - baseVram) {
                        mem[writePos] = (this.currentColorIdx & 0x0F) | 0x80;
                    }
                }
            }
        }
    };

    window.RAM.getVRAMBase = function() {
        if (!LGC_VRAM_BUS.usesVram()) return 0;
        const cap = LGC_VRAM_BUS.getChipCapacityBytes();
        return cap - LGC_VRAM_BUS.getTotalVramBytes();
    };
    window.RAM.getVRAMBytes = function() {
        return LGC_VRAM_BUS.getTotalVramBytes();
    };
    window.RAM.getExtraFreeBytes = function() {
        return LGC_VRAM_BUS.getExtraFreeSpaceBytes() - LGC_VRAM_BUS.tempBorrowedVramBytes;
    };
    window.RAM.setVRAMKB = function(kb) {
        return LGC_VRAM_BUS.setCodedVramBytes(Math.round(Number(kb) * 1024));
    };
    window.RAM.setVRAMBytes = function(bytes) {
        return LGC_VRAM_BUS.setCodedVramBytes(bytes);
    };
    window.RAM.requestExtraVRAM = function(extraBytes) {
        return LGC_VRAM_BUS.borrowTemporaryVram(extraBytes);
    };

    // Parse optional coded VRAM directives from a game payload: vram_kb(16), vram(16kb), vram_bytes(16384)
    function parseCodedVramFromPayload(rawPayload) {
        if (!rawPayload || typeof rawPayload !== 'string') return 0;
        const mKb = rawPayload.match(/\bvram(?:_kb)?\s*\(\s*(\d+(?:\.\d+)?)\s*(?:kb)?\s*\)/i);
        if (mKb) return Math.round(parseFloat(mKb[1]) * 1024);
        const mBytes = rawPayload.match(/\bvram_bytes\s*\(\s*(\d+)\s*\)/i);
        if (mBytes) return parseInt(mBytes[1], 10);
        return 0;
    }

    // Override mountProgramToChipRAM so:
    // - Line 8 Chip reserves 12KB Base VRAM (or coded VRAM), loads the game into RAM, and leaves the rest as shared extra space
    // - CRT Chip reserves 0KB VRAM (Amiga unified RAM architecture)
    HARDWARE_MEM_ENFORCER.mountProgramToChipRAM = function(appTitle, rawPayload) {
        LGC_VRAM_BUS.codedVramBytes = 0;
        LGC_VRAM_BUS.tempBorrowedVramBytes = 0;
        LGC_VRAM_BUS.peakTempBorrowedBytes = 0;
        LGC_VRAM_BUS.frameCommandBytes = 0;

        let cleanPayload = rawPayload || '';
        if (SYSTEM.localStorageEnabled) {
            const savedApps = APP_STORAGE.load();
            if (savedApps && Array.isArray(savedApps)) {
                const matchFromLS = savedApps.find(a => a && a.title === appTitle);
                if (matchFromLS && matchFromLS.payload) {
                    cleanPayload = matchFromLS.payload.startsWith('LMT::')
                        ? decodeLMT(matchFromLS.payload.replace('LMT::', ''))
                        : matchFromLS.payload;
                }
            }
        }

        const codedVram = parseCodedVramFromPayload(cleanPayload);
        if (SYSTEM.chipMode === 0) {
            LGC_VRAM_BUS.codedVramBytes = codedVram > 0 ? codedVram : 0;
        }

        if (!this.isActive()) {
            this.vramReservedBytes = LGC_VRAM_BUS.getBaseVramBytes();
            window.RAM.VRAM_BASE = SYSTEM.chipMode === 0 ? (65536 - this.vramReservedBytes) : 0xA000;
            return true;
        }

        this.syncChipHardwareBuffer();
        const limit = this.getLimitBytes();
        const mem = this.getActiveMemoryBuffer();
        mem.fill(0);

        this.activeProgramTitle = appTitle || 'PROGRAM';
        this.allocatedProgramBytes = 0;
        this.allocatedHeapBytes = 0;
        // Line 8 Chip reserves 12KB (or custom coded VRAM); CRT Chip reserves 0KB VRAM!
        this.vramReservedBytes = LGC_VRAM_BUS.getBaseVramBytes();
        this.storageMountedBytes = 0;
        this.peakUsedBytes = 0;
        this.activeBankIndex = 0;
        this.totalBanks = 1;
        this.virtualDiskTotalBytes = 0;
        this.namedSections = {};

        const vramStart = limit - this.vramReservedBytes;
        this.swapWindowAddr = Math.max(0x4000, vramStart - this.bankSize);
        window.RAM.VRAM_BASE = SYSTEM.chipMode === 0 ? vramStart : 0xA000;

        const extractedSections = {};
        if (SYSTEM.localStorageEnabled) {
            cleanPayload = cleanPayload.replace(/\[BANK:([a-zA-Z0-9_\-]+)\]([\s\S]*?)\[\/BANK\]/gi, function(_, secName, secBody) {
                extractedSections[secName.trim()] = secBody;
                return '';
            });
        }

        if (this.strictChipLock && !SYSTEM.localStorageEnabled) {
            const req256 = cleanPayload.includes('utilize_256kb') || cleanPayload.includes('utilize_256');
            const req128 = cleanPayload.includes('utilize_128kb');
            if (req256 && SYSTEM.chipMode < 2) {
                this.triggerOOM('REAL MEM: REQ 256KB CRT (ON ' + this.getLimitKB() + 'KB CHIP)');
                return false;
            }
            if (req128 && SYSTEM.chipMode < 1) {
                this.triggerOOM('REAL MEM: REQ 128KB CRT (ON ' + this.getLimitKB() + 'KB CHIP)');
                return false;
            }
        }

        const baseOffset = 0x0200;
        let rawBytes = null;
        const ch81Match = cleanPayload.match(/\[CH81_PAYLOAD\]([\s\S]*?)\[\/CH81_PAYLOAD\]/i);
        if (ch81Match) {
            const hexClean = ch81Match[1].replace(/\s/g, '');
            const byteLen = Math.ceil(hexClean.length / 2);
            rawBytes = new Uint8Array(byteLen);
            for (let i = 0; i < hexClean.length; i += 2) {
                rawBytes[i >> 1] = parseInt(hexClean.substring(i, i + 2), 16) & 0xFF;
            }
        } else {
            rawBytes = new Uint8Array(cleanPayload.length);
            for (let i = 0; i < cleanPayload.length; i++) {
                rawBytes[i] = cleanPayload.charCodeAt(i) & 0xFF;
            }
        }

        const byteFootprint = rawBytes.length;
        const maxResidentBytes = limit - this.vramReservedBytes - baseOffset;

        if (byteFootprint <= maxResidentBytes) {
            for (let i = 0; i < byteFootprint; i++) {
                mem[baseOffset + i] = rawBytes[i];
            }
            this.allocatedProgramBytes = baseOffset + byteFootprint;
            if (SYSTEM.localStorageEnabled) {
                this.stageToVirtualDisk(this.activeProgramTitle, rawBytes, extractedSections);
            }
            const freeExtraKB = ((limit - this.allocatedProgramBytes - this.vramReservedBytes) / 1024).toFixed(1);
            if (SYSTEM.chipMode === 0) {
                SYSTEM.notification = 'L8: ' + (this.allocatedProgramBytes/1024).toFixed(1) + 'K PRG + ' + (this.vramReservedBytes/1024).toFixed(0) + 'K VRAM (' + freeExtraKB + 'K EXTRA)';
            } else {
                SYSTEM.notification = 'CRT UNIFIED: ' + (this.allocatedProgramBytes/1024).toFixed(1) + 'K / ' + this.getLimitKB() + 'KB (0K VRAM)';
            }
            SYSTEM.notifTimer = 180;
            return true;
        }

        if (!SYSTEM.localStorageEnabled) {
            const totalKB = ((baseOffset + byteFootprint + this.vramReservedBytes) / 1024).toFixed(1);
            this.triggerOOM('PRG+VRAM (' + totalKB + 'KB) > ' + this.getLimitKB() + 'KB (ENABLE LS FOR BANKING)');
            return false;
        }

        if (!this.stageToVirtualDisk(this.activeProgramTitle, rawBytes, extractedSections)) {
            this.triggerOOM('VIRTUAL DISK FULL: CANNOT STAGE ' + (byteFootprint / 1024).toFixed(1) + 'KB');
            return false;
        }

        const fixedResidentMax = Math.max(this.bankSize, this.swapWindowAddr - baseOffset);
        const copyLen = Math.min(byteFootprint, fixedResidentMax);
        for (let i = 0; i < copyLen; i++) {
            mem[baseOffset + i] = rawBytes[i];
        }
        const firstSwapBank = Math.floor(copyLen / this.bankSize);
        this.loadBankFromDisk(firstSwapBank, this.swapWindowAddr);
        this.allocatedProgramBytes = baseOffset + copyLen;
        const spilledKB = ((byteFootprint - copyLen) / 1024).toFixed(1);
        SYSTEM.notification = 'BANKED: ' + this.getLimitKB() + 'KB RAM + ' + spilledKB + 'KB ON LS';
        SYSTEM.notifTimer = 200;
        return true;
    };

    // Ensure auditRuntimeMemory accounts for Line 8 temporary borrowed VRAM vs CRT 0-VRAM unified memory
    const _origAuditRuntimeMemory = HARDWARE_MEM_ENFORCER.auditRuntimeMemory.bind(HARDWARE_MEM_ENFORCER);
    HARDWARE_MEM_ENFORCER.auditRuntimeMemory = function() {
        this.vramReservedBytes = LGC_VRAM_BUS.getTotalVramBytes();
        return _origAuditRuntimeMemory();
    };

    // 3. ULTRA-FAST LGC PRIMITIVES (LGC WORKS WITH VRAM ON LINE 8 OR WITHOUT VRAM ON CRT)
    LGC.setColor = function(c) {
        if (!false) {
            if (SYSTEM.real8BitMode && SYSTEM.chipMode === 0) {
                c = window.snapTo8BitColor(c);
            }
            LGC_VRAM_BUS.currentColorIdx = colorTo4BitIndex(c);
        }
        this.color = c;
        if (this._lastAppliedColor !== c) {
            this._lastAppliedColor = c;
            this.ctx.fillStyle = c;
            this.ctx.strokeStyle = c;
        }
    };

    const _origLgcClear = LGC.clear.bind(LGC);
    LGC.clear = function() {
        this._lastAppliedColor = '';
        this._lastAppliedFont = '';
        _origLgcClear();
        if (!false) {
            LGC_VRAM_BUS.hwClearVram(LGC_VRAM_BUS.currentColorIdx);
        }
    };

    LGC.rect = function(x, y, w, h) {
        this.drawCalls++;
        if (this._lastAppliedColor !== this.color) {
            this._lastAppliedColor = this.color;
            this.ctx.fillStyle = this.color;
        }
        const ix = x | 0, iy = y | 0, iw = w | 0, ih = h | 0;
        this.ctx.fillRect(ix, iy, iw, ih);
        if (!false) {
            LGC_VRAM_BUS.hwWriteRectToVram(ix, iy, iw, ih, LGC_VRAM_BUS.currentColorIdx);
        }
    };

    LGC.setPixel = function(x, y) {
        this.drawCalls++;
        if (this._lastAppliedColor !== this.color) {
            this._lastAppliedColor = this.color;
            this.ctx.fillStyle = this.color;
        }
        const ix = x | 0, iy = y | 0;
        this.ctx.fillRect(ix, iy, 1, 1);
        if (!false) {
            LGC_VRAM_BUS.hwWriteRectToVram(ix, iy, 1, 1, LGC_VRAM_BUS.currentColorIdx);
        }
    };

    // 4. TWO-STAGE SMART SPRITE & LMV BLITTER (FIXES DYNAMIC SPRITE CANVAS LAG)
    //    - Stage 1 (First time seen / dynamic per-frame sprites): Horizontal Span-Merging
    //      with _FAST_HEX_NIBBLE (zero canvas allocation, 3x-5x fewer fillRect calls).
    //    - Stage 2 (Static sprites seen >= 2 times): Promoted to GPU Offscreen Canvas
    //      and blitted with a single ctx.drawImage() call!
    const _SPRITE_GPU_CACHE = new Map();
    const _LMV_GPU_CACHE = new Map();
    const _MAX_GPU_CACHE_ENTRIES = 512;

    LGC.drawSprite = function(x, y, hexData, w, h, ignoreBlack = true, scale = 1) {
        if (!hexData) return;
        this.drawCalls++;
        if (!false) LGC_VRAM_BUS.hwRecordBlitBytes((w * h) | 0);
        const pW = this.width / 128;
        const pH = this.height / 96;
        const len = hexData.length;

        if ((false || SYSTEM.chipMode > 0) && len <= 1024) {
            const cacheKey = w + ':' + h + ':' + (ignoreBlack ? 1 : 0) + ':' + hexData;
            let entry = _SPRITE_GPU_CACHE.get(cacheKey);
            if (entry) {
                if (entry.bmp) {
                    this.ctx.drawImage(entry.bmp, (x * pW) | 0, (y * pH) | 0, (w * scale * pW) | 0, (h * scale * pH) | 0);
                    this._lastAppliedColor = '';
                    return;
                }
                entry.hits++;
                if (entry.hits >= 2) {
                    const bmp = document.createElement('canvas');
                    bmp.width = w; bmp.height = h;
                    const bCtx = bmp.getContext('2d');
                    let ptr = 0;
                    for (let j = 0; j < h; j++) {
                        let i = 0;
                        while (i < w && ptr < len) {
                            const code = hexData.charCodeAt(ptr++);
                            const cIdx = code < 128 ? _FAST_HEX_NIBBLE[code] : -1;
                            if (cIdx < 0 || (ignoreBlack && cIdx === 0)) { i++; continue; }
                            let run = 1;
                            while (i + run < w && ptr < len) {
                                const nc = hexData.charCodeAt(ptr);
                                if ((nc < 128 ? _FAST_HEX_NIBBLE[nc] : -1) === cIdx) { run++; ptr++; } else break;
                            }
                            bCtx.fillStyle = LMV_COLORS_HEX[cIdx];
                            bCtx.fillRect(i, j, run, 1);
                            i += run;
                        }
                    }
                    entry.bmp = bmp;
                    this.ctx.drawImage(bmp, (x * pW) | 0, (y * pH) | 0, (w * scale * pW) | 0, (h * scale * pH) | 0);
                    this._lastAppliedColor = '';
                    return;
                }
            } else {
                if (_SPRITE_GPU_CACHE.size >= _MAX_GPU_CACHE_ENTRIES) _SPRITE_GPU_CACHE.clear();
                _SPRITE_GPU_CACHE.set(cacheKey, { hits: 1, bmp: null });
            }
        }

        // Fast Horizontal Span-Merged Direct Blit (for dynamic sprites or 1st-hit sprites)
        const ctx = this.ctx;
        const stepW = scale * pW;
        const stepH = scale * pH;
        const baseX = x * pW;
        const baseY = y * pH;
        let ptr = 0;
        let lastC = -1;
        for (let j = 0; j < h; j++) {
            let i = 0;
            const drawY = (baseY + j * stepH) | 0;
            const drawH = Math.ceil(stepH);
            while (i < w && ptr < len) {
                const code = hexData.charCodeAt(ptr++);
                const cIdx = code < 128 ? _FAST_HEX_NIBBLE[code] : -1;
                if (cIdx < 0 || (ignoreBlack && cIdx === 0)) { i++; continue; }
                let run = 1;
                while (i + run < w && ptr < len) {
                    const nc = hexData.charCodeAt(ptr);
                    if ((nc < 128 ? _FAST_HEX_NIBBLE[nc] : -1) === cIdx) { run++; ptr++; } else break;
                }
                if (cIdx !== lastC) {
                    ctx.fillStyle = LMV_COLORS_HEX[cIdx];
                    lastC = cIdx;
                }
                ctx.fillRect((baseX + i * stepW) | 0, drawY, Math.ceil(run * stepW), drawH);
                i += run;
            }
        }
        ctx.fillStyle = this.color;
        this._lastAppliedColor = this.color;
    };

    const _origDrawLMV = LGC.drawLMV.bind(LGC);
    LGC.drawLMV = function(frameStr, startX = 0, startY = 0, drawWidth = 128, ignoreBlack = false, scale = 1) {
        if (!frameStr) return;
        if (!false) LGC_VRAM_BUS.hwRecordBlitBytes(frameStr.length);
        if (false || SYSTEM.chipMode > 0) {
            this.drawCalls++;
            const cacheKey = frameStr.length + ':' + frameStr.slice(0, 32) + ':' + frameStr.slice(-32) + '|' + drawWidth + '|' + (ignoreBlack ? 1 : 0);
            let entry = _LMV_GPU_CACHE.get(cacheKey);
            if (entry && entry.raw === frameStr) {
                if (entry.bmp) {
                    const pW = this.width / 128;
                    const pH = this.height / 96;
                    this.ctx.drawImage(entry.bmp, 0, 0, drawWidth, entry.h, (startX * pW) | 0, (startY * pH) | 0, (drawWidth * scale * pW) | 0, (entry.h * scale * pH) | 0);
                    this._lastAppliedColor = '';
                    return;
                }
                entry.hits++;
                if (entry.hits >= 2) {
                    const bmp = document.createElement('canvas');
                    bmp.width = drawWidth; bmp.height = 96;
                    const bCtx = bmp.getContext('2d');
                    const parts = frameStr.split(',');
                    let ptr = 0;
                    for (let i = 0; i < parts.length; i++) {
                        const p = parts[i];
                        if (!p) continue;
                        const cIdx = parseInt(p[0], 16);
                        let count = parseInt(p.substring(1), 16);
                        const isTransp = ignoreBlack && cIdx === 0;
                        if (!isTransp) bCtx.fillStyle = LMV_COLORS_HEX[cIdx];
                        while (count > 0) {
                            const rx = ptr % drawWidth;
                            const ry = (ptr / drawWidth) | 0;
                            const spaceLeft = drawWidth - rx;
                            const drawLen = count < spaceLeft ? count : spaceLeft;
                            if (!isTransp) bCtx.fillRect(rx, ry, drawLen, 1);
                            ptr += drawLen; count -= drawLen;
                        }
                    }
                    entry.bmp = bmp;
                    entry.h = Math.max(1, Math.ceil(ptr / drawWidth));
                    const pW = this.width / 128;
                    const pH = this.height / 96;
                    this.ctx.drawImage(bmp, 0, 0, drawWidth, entry.h, (startX * pW) | 0, (startY * pH) | 0, (drawWidth * scale * pW) | 0, (entry.h * scale * pH) | 0);
                    this._lastAppliedColor = '';
                    return;
                }
            } else {
                if (_LMV_GPU_CACHE.size >= 96) _LMV_GPU_CACHE.clear();
                _LMV_GPU_CACHE.set(cacheKey, { raw: frameStr, hits: 1, bmp: null, h: 96 });
            }
        }
        _origDrawLMV(frameStr, startX, startY, drawWidth, ignoreBlack, scale);
    };

    // 5. FAST PROCEDURAL EFFECTS IN PERFORMANCE MODE (PLASMA, FIRE, TUNNEL, STATIC, MODE7, LGM)
    const _origDitherRect = LGC.ditherRect.bind(LGC);
    LGC.ditherRect = function(x, y, w, h, pattern) {
        if (false) {
            this.drawCalls++;
            const prevAlpha = this.ctx.globalAlpha;
            this.ctx.fillStyle = this.color;
            this.ctx.globalAlpha = 0.5;
            this.ctx.fillRect(x | 0, y | 0, w | 0, h | 0);
            this.ctx.globalAlpha = prevAlpha;
            this._lastAppliedColor = '';
            return;
        }
        _origDitherRect(x, y, w, h, pattern);
    };

    const _origDrawPlasma = LGC.drawPlasma.bind(LGC);
    LGC.drawPlasma = function(x, y, w, h, time) {
        if (false) {
            this.drawCalls++;
            const ctx = this.ctx; const ix = x | 0, iy = y | 0;
            for (let i = 0; i < w; i += 4) {
                for (let j = 0; j < h; j += 4) {
                    const v = Math.sin((i + time) * 0.1) + Math.sin((j + time) * 0.1);
                    ctx.fillStyle = LMV_COLORS_HEX[((Math.abs(v) * 4) | 0) & 15];
                    ctx.fillRect(ix + i, iy + j, 4, 4);
                }
            }
            this._lastAppliedColor = '';
            return;
        }
        _origDrawPlasma(x, y, w, h, time);
    };

    const _origDrawFire = LGC.drawFire.bind(LGC);
    LGC.drawFire = function(x, y, w, h, time) {
        if (false) {
            this.drawCalls++;
            const ctx = this.ctx; const ix = x | 0, iy = y | 0; const pal = [4, 10, 7, 0];
            for (let i = 0; i < w; i += 4) {
                for (let j = 0; j < h; j += 4) {
                    const v = Math.sin((i + time) * 0.2) * Math.cos((j - time) * 0.33);
                    ctx.fillStyle = LMV_COLORS_HEX[pal[((Math.abs(v) * 2) | 0) & 3]];
                    ctx.fillRect(ix + i, iy + j, 4, 4);
                }
            }
            this._lastAppliedColor = '';
            return;
        }
        _origDrawFire(x, y, w, h, time);
    };

    const _origDrawStatic = LGC.drawStatic.bind(LGC);
    LGC.drawStatic = function(x, y, w, h) {
        if (false) {
            this.drawCalls++;
            const ctx = this.ctx; const ix = x | 0, iy = y | 0;
            for (let i = 0; i < w; i += 4) {
                for (let j = 0; j < h; j += 4) {
                    ctx.fillStyle = Math.random() > 0.5 ? '#FFFFFF' : '#000000';
                    ctx.fillRect(ix + i, iy + j, 4, 4);
                }
            }
            this._lastAppliedColor = '';
            return;
        }
        _origDrawStatic(x, y, w, h);
    };

    const _origDraw3DPlane = LGC.draw3DPlane.bind(LGC);
    LGC.draw3DPlane = function(camX, camY, camZ, pitch, angle, horizon, hexC1, hexC2) {
        if (false) {
            this.drawCalls++;
            const ctx = this.ctx;
            const sinA = Math.sin(angle), cosA = Math.cos(angle);
            const step = 2;
            for (let y = horizon | 0; y < this.height; y += step) {
                const z = (y - horizon) + 1;
                const pz = camZ / z;
                let rowX = -camX + (pz * cosA) * pitch;
                let rowY = -camY + (pz * sinA) * pitch;
                const stepX = ((pz * -sinA) / this.width * pitch) * step;
                const stepY = ((pz * cosA) / this.width * pitch) * step;
                for (let x = 0; x < this.width; x += step) {
                    const tx = (rowX | 0) & 7;
                    const ty = (rowY | 0) & 7;
                    ctx.fillStyle = ((tx ^ ty) & 4) ? hexC1 : hexC2;
                    ctx.fillRect(x, y, step, step);
                    rowX += stepX; rowY += stepY;

            }
            this._lastAppliedColor = '';
            return;
        }
        _origDraw3DPlane(camX, camY, camZ, pitch, angle, horizon, hexC1, hexC2);
    };

    const _origDrawLGM = LGC.drawLGM.bind(LGC);
    LGC.drawLGM = function(mode, camX, camY, camZ, pitch, angle, horizon, time) {
        if (false) {
            this.drawCalls++;
            const ctx = this.ctx;
            const sinA = Math.sin(angle), cosA = Math.cos(angle);
            const step = 4;
            for (let y = horizon | 0; y < this.height; y += step) {
                const z = (y - horizon) + 1;
                const pz = camZ / z;
                let rowX = -camX + (pz * cosA) * pitch;
                let rowY = -camY + (pz * sinA) * pitch;
                const stepX = ((pz * -sinA) / this.width * pitch) * step;
                const stepY = ((pz * cosA) / this.width * pitch) * step;
                for (let x = 0; x < this.width; x += step) {
                    const tx = rowX | 0;
                    const ty = rowY | 0;
                    let cIdx = 0;
                    if (mode === 0) { cIdx = ((tx & 7) ^ (ty & 7)) & 4 ? 3 : 0; }
                    else if (mode === 1) { const v = Math.sin((tx + time) * 0.1) + Math.sin((ty + time) * 0.1); cIdx = ((Math.abs(v) * 3) | 0) & 15; }
                    else if (mode === 2) { const v = Math.sin((tx + time) * 0.2) * Math.cos((ty - time) * 0.33); const pal = [4, 10, 7, 0]; cIdx = pal[((Math.abs(v) * 2) | 0) & 3]; }
                    else if (mode === 3) { cIdx = ((tx * 17 + ty * 31 + (time | 0)) & 1) ? 3 : 0; }
                    else if (mode === 4) { const d = Math.sqrt(tx * tx + ty * ty); const v = Math.sin(d * 0.2 - time * 0.2); cIdx = ((Math.abs(v) * 4) | 0) & 15; }
                    ctx.fillStyle = LMV_COLORS_HEX[cIdx];
                    ctx.fillRect(x, y, step, step);
                    rowX += stepX; rowY += stepY;
                }
            }
            this._lastAppliedColor = '';
            return;
        }
        _origDrawLGM(mode, camX, camY, camZ, pitch, angle, horizon, time);
    };

    let _lastSndTime = 0;
    let _lastSndFreq = -1;
    const _origLinepadPlay = LINEPAD.play.bind(LINEPAD);
    LINEPAD.play = function(type, freq, duration, vol = 0.5, endFreq = null, opts = {}) {
        if (false) {
            const now = performance.now();
            if (now - _lastSndTime < 14 && Math.abs((freq | 0) - _lastSndFreq) < 8) {
                return;
            }
            _lastSndTime = now;
            _lastSndFreq = freq | 0;
        }
        return _origLinepadPlay(type, freq, duration, vol, endFreq, opts);
    };

    // 6. UPGRADED MAIN LOOP WITH ZERO-LAG TURBO SCHEDULER
    const _INPUT_KEYS = Object.keys(inputs);
    const _NUM_INPUT_KEYS = _INPUT_KEYS.length;

    window.mainLoop = function(timestamp) {
        if (!lastTime) lastTime = timestamp;
        const deltaTime = timestamp - lastTime;
        lastTime = timestamp;
        pollInputs();
        LGC.drawCalls = 0;

        if (!(false && SYSTEM.state === 'APP' && TRUE_KERNEL_CH81.state !== 'RUNNING')) {
            if (SYSTEM.chipMode > 0) {
                for (let i = 0; i < 100; i++) CRT_CHIP.step();
            } else {
                for (let i = 0; i < 50; i++) LINE128_MEMORY.step();
            }
        }

        if (inputs.back && !prevInputs.back && SYSTEM.state !== 'OS' && SYSTEM.state !== 'MEDIA_PROMPT' && SYSTEM.state !== 'REMAPPER' && SYSTEM.state !== 'AKP_CHECK') {
            TRUE_KERNEL_8CHIPI.sysCall_Yield();
        }

        if (SYSTEM.state === 'BOOT_LMT') {
            LGC.setColor(SYSTEM.colorMode ? '#FFF' : '#b4b4b4'); LGC.clear();
            LGC.setColor(SYSTEM.colorMode ? '#000' : '#111'); LGC.setFont('10px monospace');
            LGC.text('KERNEL LOADING...', 4, 30);
            let chunkSize = Math.max(1, Math.floor(SYSTEM.bootLMT.length / (false ? 10 : 30)));
            SYSTEM.bootLineIdx += chunkSize;
            let displayStr = SYSTEM.bootLMT.slice(Math.max(0, SYSTEM.bootLineIdx - 15), SYSTEM.bootLineIdx).join(' ');
            LGC.text(displayStr.substring(0, 20), 4, 50);
            LGC.strokeRect(4, 65, LGC.width - 8, 6);
            LGC.rect(4, 65, (SYSTEM.bootLineIdx / SYSTEM.bootLMT.length) * (LGC.width - 8), 6);
            if (SYSTEM.bootLineIdx >= SYSTEM.bootLMT.length) finalizeAppLaunch(SYSTEM.bootApp);
        }
        else if (SYSTEM.state === 'ACCESS_DENIED') {
            LGC.setColor(SYSTEM.colorMode ? '#FFF' : '#b4b4b4'); LGC.clear();
            LGC.setColor(SYSTEM.colorMode ? '#000' : '#111'); LGC.setFont('bold 12px monospace');
            LGC.text('PROGRAM DENIED', 15, 35); LGC.setFont('10px monospace');
            let msg = SYSTEM.panicMsg || 'UNAUTHORIZED KERNEL CALL';
            if (LGC.measureText(msg).width > LGC.width - 10) {
                let words = msg.split(' '); let line = ''; let y = 55;
                for (let w of words) {
                    if (LGC.measureText(line + w + ' ').width > LGC.width - 10) {
                        LGC.text(line, 2, y); y += 10; line = w + ' ';
                    } else { line += w + ' '; }
                }
                LGC.text(line, 2, y);
            } else { LGC.text(msg, 2, 55); }
            if (Math.floor(Date.now() / 500) % 2 === 0) LGC.text('PRESS ESC TO EXIT', 20, 80);
        }
        else if (SYSTEM.state === 'APP_INFO') {
            LGC.setColor(SYSTEM.colorMode ? '#FFF' : '#b4b4b4'); LGC.clear();
            LGC.setColor(SYSTEM.colorMode ? '#000' : '#111'); LGC.setFont('bold 12px monospace');
            LGC.text('[ ' + APP_INFO_DISPLAY.label.toUpperCase() + ' ]', 2, 14);
            LGC.setFont('bold 10px monospace'); LGC.text('TITLE: ' + APP_INFO_DISPLAY.title, 2, 30);
            if (!APP_INFO_DISPLAY.lines) {
                APP_INFO_DISPLAY.lines = []; let words = APP_INFO_DISPLAY.desc.split(' '); let line = '';
                LGC.setFont('10px monospace');
                for (let w of words) {
                    if (LGC.measureText(line + w + ' ').width > LGC.width - 10) {
                        if (line.trim() === '') { APP_INFO_DISPLAY.lines.push(w); }
                        else { APP_INFO_DISPLAY.lines.push(line); line = w + ' '; }
                    } else { line += w + ' '; }
                }
                if (line.trim() !== '') APP_INFO_DISPLAY.lines.push(line);
                APP_INFO_DISPLAY.scrollY = 0; APP_INFO_DISPLAY.scrollDelay = 0;
            }
            LGC.setFont('10px monospace'); let y = 50; let limit = Math.floor((LGC.height - 55) / 12);
            for (let i = APP_INFO_DISPLAY.scrollY; i < Math.min(APP_INFO_DISPLAY.lines.length, APP_INFO_DISPLAY.scrollY + limit); i++) {
                LGC.text(APP_INFO_DISPLAY.lines[i], 2, y); y += 12;
            }
            if (inputs.up || inputs.w) {
                if (APP_INFO_DISPLAY.scrollDelay <= 0) { APP_INFO_DISPLAY.scrollY = Math.max(0, APP_INFO_DISPLAY.scrollY - 1); APP_INFO_DISPLAY.scrollDelay = 5; }
                else APP_INFO_DISPLAY.scrollDelay--;
            } else if (inputs.down || inputs.s) {
                if (APP_INFO_DISPLAY.scrollDelay <= 0) { APP_INFO_DISPLAY.scrollY = Math.min(Math.max(0, APP_INFO_DISPLAY.lines.length - limit), APP_INFO_DISPLAY.scrollY + 1); APP_INFO_DISPLAY.scrollDelay = 5; }
                else APP_INFO_DISPLAY.scrollDelay--;
            } else { APP_INFO_DISPLAY.scrollDelay = 0; }
            if (APP_INFO_DISPLAY.scrollY > 0) LGC.text('^', LGC.width - 10, 45);
            if (APP_INFO_DISPLAY.scrollY < Math.max(0, APP_INFO_DISPLAY.lines.length - limit)) LGC.text('v', LGC.width - 10, LGC.height - 5);
        }
        else if (SYSTEM.state === 'OS') {
            const items = MENUS[currentMenu];
            if (inputs.c && !prevInputs.c && (currentMenu === 'GAMES' || currentMenu === 'MEDIA') && items[SYSTEM.menuIdx] && items[SYSTEM.menuIdx].appData) {
                APP_INFO_DISPLAY = items[SYSTEM.menuIdx].appData; APP_INFO_DISPLAY.lines = null; SYSTEM.state = 'APP_INFO'; uiLayer.style.display = 'none';
            } else {
                if ((inputs.up || inputs.w) && !(prevInputs.up || prevInputs.w)) { SYSTEM.menuIdx = (SYSTEM.menuIdx - 1 + items.length) % items.length; renderMenu(); }
                if ((inputs.down || inputs.s) && !(prevInputs.down || prevInputs.s)) { SYSTEM.menuIdx = (SYSTEM.menuIdx + 1) % items.length; renderMenu(); }
                let actionPressed = (inputs.a && !prevInputs.a) || (inputs.b && !prevInputs.b) || (inputs.y && !prevInputs.y) || (inputs.c && !prevInputs.c);
                if (actionPressed) items[SYSTEM.menuIdx].action();
                if (inputs.back && !prevInputs.back && currentMenu !== 'MAIN') loadMenu('MAIN');
            }
            updateZ80Regs();
        }

        if (SYSTEM.state === 'CALC') renderCalculator();
        if (SYSTEM.state === 'TERMINAL') renderTerminal();
        if (SYSTEM.state === 'INSTALLER') { updateNativeInstaller(); renderNativeInstaller(); }
        if (SYSTEM.state === 'APP_MANAGER') { updateAppManager(); renderAppManager(); }
        if (SYSTEM.state === 'SAV_MANAGER') { updateSavManager(); renderSavManager(); }
        if (SYSTEM.state === 'REMAPPER') { updateRemapper(); renderRemapper(); }
        if (SYSTEM.state === 'MEDIA_PROMPT') {
            LGC.setColor(SYSTEM.colorMode ? '#FFF' : '#b4b4b4'); LGC.clear();
            LGC.setColor(SYSTEM.colorMode ? '#000' : '#111'); LGC.setFont('bold 10px monospace');
            LGC.text('MEDIA PROCESSOR', 2, 10); LGC.line(0, 12, LGC.width, 12);
            LGC.setFont('10px monospace'); LGC.text('FILE: ' + MEDIA_PROMPT_STATE.title + '.' + MEDIA_PROMPT_STATE.ext, 5, 25);
            for (let i = 0; i < MEDIA_PROMPT_STATE.options.length; i++) {
                LGC.text((i === MEDIA_PROMPT_STATE.cursor ? '> ' : '  ') + MEDIA_PROMPT_STATE.options[i], 5, 45 + i * 10);
            }
            if ((inputs.up || inputs.w) && !(prevInputs.up || prevInputs.w)) MEDIA_PROMPT_STATE.cursor = Math.max(0, MEDIA_PROMPT_STATE.cursor - 1);
            if ((inputs.down || inputs.s) && !(prevInputs.down || prevInputs.s)) MEDIA_PROMPT_STATE.cursor = Math.min(MEDIA_PROMPT_STATE.options.length - 1, MEDIA_PROMPT_STATE.cursor + 1);
            let actionPressed = (inputs.a && !prevInputs.a) || (inputs.b && !prevInputs.b) || (inputs.y && !prevInputs.y) || (inputs.c && !prevInputs.c);
            if (actionPressed) { executeMediaPromptAction(); }
        }
        if (SYSTEM.state === 'LMF_INDEX') {
            if (inputs.up || inputs.w) LMF_INDEX.scrollY = Math.max(0, LMF_INDEX.scrollY - 1);
            if (inputs.down || inputs.s) LMF_INDEX.scrollY = Math.min(Math.max(0, LMF_INDEX.lines.length - 5), LMF_INDEX.scrollY + 1);
            if (inputs.left || inputs.a_key) LMF_INDEX.scrollX = Math.max(0, LMF_INDEX.scrollX - 5);
            if (inputs.right || inputs.d) LMF_INDEX.scrollX += 5;
            if (inputs.c && !prevInputs.c) { LMF_INDEX.wrap = !LMF_INDEX.wrap; LMF_INDEX.scrollX = 0; updateLMFIndexLines(); }
            renderLMFIndex();
        }
        if (SYSTEM.state === 'CUSTOM_APP') { if (window.updateCustomApp) window.updateCustomApp(); renderCustomApp(); }
        if (SYSTEM.state === 'MEDIA_MAKER') {
            LGC.setColor(SYSTEM.colorMode ? '#FFF' : '#b4b4b4'); LGC.clear();
            LGC.setColor(SYSTEM.colorMode ? '#000' : '#111'); LGC.setFont('bold 12px monospace');
            LGC.text('MEDIA MAKER', 10, 20); LGC.setFont('10px monospace'); LGC.text('CONVERTS MEDIA TO 8-BIT', 5, 35);
            if (Math.floor(Date.now() / 500) % 2 === 0) LGC.text('PRESS FACE BTN TO UPLOAD', 15, 60);
            let actionPressed = (inputs.a && !prevInputs.a) || (inputs.b && !prevInputs.b) || (inputs.y && !prevInputs.y) || (inputs.c && !prevInputs.c);
            if (actionPressed) { document.getElementById('media-loader').click(); }
        }
        else if (SYSTEM.state === 'MEDIA_PROCESSING') {
            if (!MEDIA_MAKER_STATE.capturing) { videoElement.play(); MEDIA_MAKER_STATE.capturing = true; MEDIA_MAKER_STATE.frames = []; MEDIA_MAKER_STATE.lastTime = timestamp; MEDIA_MAKER_STATE.frameCount = 0; }
            if (timestamp - MEDIA_MAKER_STATE.lastTime > 100) {
                MEDIA_MAKER_STATE.lastTime = timestamp;
                if (videoElement.ended || MEDIA_MAKER_STATE.frameCount > 300) {
                    videoElement.pause(); MEDIA_MAKER_STATE.capturing = false; MEDIA_MAKER_STATE.resultPayload = MEDIA_MAKER_STATE.frames.join('|');
                    let virtualLMF = (MEDIA_MAKER_STATE.appName || 'CUSTOM_VIDEO') + ' (title)(VIDEO)\nSYS_CALL:0x88A1\ndescription(Line Media Video Payload)\nrun(ROM_LMV)\n[LMV_PAYLOAD]\n' + MEDIA_MAKER_STATE.resultPayload + '\n[/LMV_PAYLOAD]\n========';
                    launchMediaPrompt(MEDIA_MAKER_STATE.appName || 'CUSTOM_VIDEO', 'lmv', virtualLMF);
                } else {
                    offCtx.drawImage(videoElement, 0, 0, 128, 96); let imgData = offCtx.getImageData(0, 0, 128, 96).data;
                    let lastColor = null; let count = 0; let frameStr = ''; const pW = LGC.width / 128; const pH = LGC.height / 96; LGC.clear(); let ptr = 0;
                    for (let i = 0; i < imgData.length; i += 4) {
                        let r = imgData[i], g = imgData[i + 1], b = imgData[i + 2]; let minDist = Infinity; let cIdx = 0;
                        for (let j = 0; j < 16; j++) { let p = LMV_PALETTE[j]; let dist = Math.pow(r - p[0], 2) + Math.pow(g - p[1], 2) + Math.pow(b - p[2], 2); if (dist < minDist) { minDist = dist; cIdx = j; } }
                        let cHex = cIdx.toString(16).toUpperCase(); LGC.ctx.fillStyle = LMV_COLORS_HEX[cIdx]; let dx = ptr % 128; let dy = Math.floor(ptr / 128); LGC.rawRect(dx * pW, dy * pH, pW, pH); ptr++;
                        if (cHex === lastColor && count < 255) count++; else { if (lastColor !== null) frameStr += lastColor + count.toString(16) + ','; lastColor = cHex; count = 1; }
                    }
                    if (count > 0) frameStr += lastColor + count.toString(16) + ',';
                    MEDIA_MAKER_STATE.frames.push(frameStr); MEDIA_MAKER_STATE.frameCount++;
                }
            }
        }
        else if (SYSTEM.state === 'MEDIA_DONE') {
            let typeTag = MEDIA_MAKER_STATE.isVideo ? 'LMV' : 'LMP';
            let virtualLMF = (MEDIA_MAKER_STATE.appName || 'CUSTOM_MEDIA') + ' (title)(MEDIA)\nSYS_CALL:0x88A1\ndescription(Line Media Payload)\nrun(ROM_' + typeTag + ')\n[' + typeTag + '_PAYLOAD]\n' + MEDIA_MAKER_STATE.resultPayload + '\n[/' + typeTag + '_PAYLOAD]\n========';
            launchMediaPrompt(MEDIA_MAKER_STATE.appName || 'CUSTOM_MEDIA', typeTag.toLowerCase(), virtualLMF);
        }

        if (SYSTEM.state === 'APP' && SYSTEM.activeApp) {
            if (false) {
                // V-Sync Locked 1:1 Frame Update in Performance Mode:
                accumulator = 0;
                try {
                    SYSTEM.activeApp.update();
                } catch (e) {
                    console.warn('Line VM Compat Layer Handled Exception:', e);
                }
            } else {
                accumulator += deltaTime;
                if (accumulator > 200) accumulator = 200;
                const stepInterval = 1000 / 60;
                while (accumulator >= stepInterval) {
                    try {
                        SYSTEM.activeApp.update();
                        if (typeof HARDWARE_MEM_ENFORCER !== 'undefined' && HARDWARE_MEM_ENFORCER.isActive() && (window.__perfTick = ((window.__perfTick || 0) + 1) & 31) === 0) {
                            HARDWARE_MEM_ENFORCER.auditRuntimeMemory();
                        }
                    } catch (e) {
                        console.warn('Line VM Compat Layer Handled Exception:', e);
                    }
                    accumulator -= stepInterval;
                }
            }
            try {
                SYSTEM.activeApp.render();
            } catch (e) {
                if (e !== 'LGC_LIMIT_EXCEEDED') console.error(e);
            }
            if (!false && uiLayer.style.display !== 'none') updateZ80Regs();
        }

        if (SYSTEM.notifTimer > 0) {
            LGC.setColor('rgba(0,0,0,0.8)'); LGC.rect(5, 5, LGC.width - 10, 15);
            LGC.setColor('#0f0'); LGC.setFont('bold 8px monospace');
            LGC.text(SYSTEM.notification, 10, 15); SYSTEM.notifTimer--;
        }

        if (SYSTEM.showRAM) {
            const limit = LGC_VRAM_BUS.getChipCapacityBytes();
            const progBytes = LGC_VRAM_BUS.getProgramAndHeapBytes();
            const vramBytes = LGC_VRAM_BUS.getTotalVramBytes();
            const extraFreeBytes = Math.max(0, limit - progBytes - vramBytes);
            const totalUsed = Math.min(limit, progBytes + vramBytes);
            const kbUsed = (totalUsed / 1024).toFixed(1);
            const kbMax = limit / 1024;
            LGC.ctx.fillStyle = 'rgba(0,0,0,0.82)';
            LGC.rawRect(0, 0, 104, 10);
            LGC.ctx.fillStyle = '#0f0';
            LGC.ctx.font = '7px monospace';
            if (LGC_VRAM_BUS.usesVram()) {
                const kbVram = (vramBytes / 1024).toFixed(0);
                const kbFree = (extraFreeBytes / 1024).toFixed(0);
                LGC.ctx.fillText('L8:' + kbUsed + '/' + kbMax + 'K V:' + kbVram + 'K F:' + kbFree + 'K', 2, 8);
            } else {
                LGC.ctx.fillText('CRT:' + kbUsed + '/' + kbMax + 'K (NO VRAM)', 2, 8);
            }
            LGC.ctx.fillStyle = LGC.color;
        }

        if (SYSTEM.showFPS) {
            window.__fpsCount = (window.__fpsCount || 0) + 1;
            if (!window.__fpsLastTs) window.__fpsLastTs = timestamp;
            const _fpsElapsed = timestamp - window.__fpsLastTs;
            if (_fpsElapsed >= 500) {
                window.__fpsStable = Math.round((window.__fpsCount * 1000) / _fpsElapsed);
                window.__fpsCount = 0;
                window.__fpsLastTs = timestamp;
            }
            let fps = (window.__fpsStable !== undefined) ? window.__fpsStable : Math.round(1000 / Math.max(1, deltaTime));
            LGC.ctx.fillStyle = 'rgba(0,0,0,0.5)';
            LGC.rawRect(LGC.width - 34, 0, 34, 10);
            LGC.ctx.fillStyle = '#0f0';
            LGC.ctx.font = '8px monospace';
            LGC.ctx.fillText('FPS:' + fps, Math.round(LGC.width - 32), 8);
            LGC.ctx.fillStyle = LGC.color;
        }

        for (let k = 0; k < _NUM_INPUT_KEYS; k++) {
            const keyName = _INPUT_KEYS[k];
            prevInputs[keyName] = inputs[keyName];
        }
        requestAnimationFrame(window.mainLoop);
    };
})();
// ============================================================================
boot();

</script>
